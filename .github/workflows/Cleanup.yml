name: Cleanup Cache

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clear GitHub Actions Cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install actions/gh-actions-cache
          REPO="${{ github.repository }}"
          
          echo "Fetching cache list..."
          caches=$(gh actions-cache list -R "$REPO" --limit 100 | awk '{print $1}')
          
          if [ -z "$caches" ]; then
            echo "No caches found to delete."
            exit 0
          fi
          
          for cache in $caches; do
            echo "Deleting cache: $cache"
            gh actions-cache delete "$cache" -R "$REPO" --confirm
          done
          echo "All caches successfully cleared."
          

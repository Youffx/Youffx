          sed -i '/if (!profile_valid(profile)) {/i\    if (profile->version < KSU_APP_PROFILE_VER) {\n        migrate_profile(profile->version, profile);\n    }' KernelSU/kernel/policy/allowlist.c
          cd ..

      - name: Apply Root Method ReSukiSU
        if: github.event.inputs.ksu_target == 'ReSukiSU'
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          cd ..

      - name: Build Kernel KSU NoMount
        id: build_timer
        run: |
          BUILD_START=$(date +%s)

          DEFCONFIG=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '."ksu-defconfig"')

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/llvm/bin:$PATH"
          export KBUILD_BUILD_USER="youffx"
          export KBUILD_BUILD_HOST="collection"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=10G
          export KBUILD_CFLAGS="-mllvm -enable-ml-inliner=release -mllvm -enable-ml-regalloc=release"

          ccache -s

          cd kernel
          make O=out $DEFCONFIG

          echo "CONFIG_NOMOUNT=y" >> out/.config

          make O=out olddefconfig
          
          echo "--- DEBUG ---"
          grep -E "NOMOUNT|KSU|SUSFS" out/.config
          echo "---------------------------------"

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz-dtb

          BUILD_END=$(date +%s)
          echo "duration=$((BUILD_END - BUILD_START))" >> $GITHUB_OUTPUT

      - name: Package Flashable Zip (NoMount)
        run: |
          DATE=$(TZ='Asia/Jakarta' date +"%Y%m%d-%H%M")
          KSU_TARGET="${{ github.event.inputs.ksu_target }}"
          case "$KSU_TARGET" in
            "KernelSU-Next") KSU_NAME="KSU" ;;
            "ReSukiSU") KSU_NAME="ReSukiSU" ;;
            "SukiSU") KSU_NAME="SukiSU" ;;
            *) KSU_NAME="KSU" ;;
          esac
          ZIP_NAME="Lineage-23.2-${KSU_NAME}-NoMount-${DATE}"

          IMAGE="kernel/out/arch/arm64/boot/Image.gz-dtb"
          mkdir -p output
          cp "$IMAGE" .github/Flash/kernels/

          cd .github/Flash/
          zip -r "../../output/${ZIP_NAME}.zip" ./*
          cd ../../

      - name: Calculate Metadata
        id: calc
        run: |
          DIFF=${{ steps.build_timer.outputs.duration }}
          MIN=$((DIFF / 60))
          SEC=$((DIFF % 60))
          echo "duration=${MIN}m ${SEC}s" >> $GITHUB_OUTPUT
          HASH=$(md5sum output/*.zip | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Upload ZIP
        uses: actions/upload-artifact@v5
        with:
          name: zip-nomount
          path: output/*.zip
          retention-days: 7

      - name: Show ccache statistics
        run: ccache -s

      - name: Get Kernel Info
        id: kinfo
        run: |
          cd kernel
          echo "commit=$(git log -1 --format='%h %s')" >> $GITHUB_OUTPUT
          echo "version=$(make kernelversion)" >> $GITHUB_OUTPUT
          echo "compiler=$($GITHUB_WORKSPACE/clang/bin/clang --version | head -n 1 | cut -d'(' -f1)" >> $GITHUB_OUTPUT

# =========================
# BUILD KSU SUSFS
# =========================
  build-ksu-susfs:
    name: Build KSU SUSFS
    needs: detect-missing-cache
    if: >-
      needs.detect-missing-cache.outputs.all_found == 'true' ||
      needs.detect-missing-cache.outputs.ksu-susfs == 'missing'
    runs-on: ubuntu-latest
    outputs:
      kern_ver: ${{ steps.kinfo.outputs.version }}
      commit_log: ${{ steps.kinfo.outputs.commit }}
      compiler_ver: ${{ steps.kinfo.outputs.compiler }}
      device_name: ${{ steps.cfg.outputs.name }}
      build_time: ${{ steps.calc.outputs.duration }}
      zip_hash: ${{ steps.calc.outputs.hash }}

    steps:
      - name: Start Timer
        id: start_timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Swap
        run: |
          sudo swapoff /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo 'vm.swappiness=10' | sudo tee /etc/sysctl.d/99-performance.conf
          sudo sysctl --system

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev liblz4-tool libncurses5-dev libssl-dev lzop rsync zip zlib1g-dev jq

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-ksu-susfs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-ksu-susfs-${{ runner.os }}-

      - name: Cache Clang 20
        id: cache-llvm
        uses: actions/cache@v5
        with:
          path: llvm
          key: llvm-mlgo-r547379

      - name: Load Config
        id: cfg
        run: |
          CONFIG=$(jq -c ".[1]" configs/resukisu.json)
          NAME=$(echo "$CONFIG" | jq -r '.name')
          echo "config=$CONFIG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Clone Kernel
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          REPO=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.repo')
          BRANCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.branch')
          DEPTH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.fetchDepth')

          REPO=$(echo "$REPO" | sed "s|https://|https://${PAT_TOKEN}@|")

          git clone --depth=$DEPTH --branch $BRANCH "$REPO" kernel

      - name: Setup Clang 20
        run: |
          if [ ! -d "llvm/bin" ]; then
            export LLVM_DIR="$PWD/llvm"
            rm -rf "$LLVM_DIR"
            mkdir -p "$LLVM_DIR"
            wget -qO- "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" | tar xz -C "$LLVM_DIR"
            wget -qO- "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/mlgo-models.tar.gz" | tar xz -C "$LLVM_DIR" || true
          fi
          echo "$PWD/llvm/bin" >> $GITHUB_PATH

      - name: Setup ccache
        run: |
          ccache -M 10G
          ccache -o compression=true
          ccache -o base_dir=$GITHUB_WORKSPACE
          ccache -o hash_dir=false
          ccache -z

      - name: Apply Root Method (KernelSU-Next)
        if: github.event.inputs.ksu_target == 'KernelSU-Next'
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/Youffx/KernelSU-Next/legacy-susfs/kernel/setup.sh | bash -s legacy-susfs
          cd ..

      - name: Apply Root Method (SukiSU)
        if: github.event.inputs.ksu_target == 'SukiSU'
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh | bash -s builtin
          # 4.19 compat: selinux_hide is only included for >=5.10, guard its function calls
          sed -i 's/    ksu_selinux_hide_handle_post_fs_data();/#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n    ksu_selinux_hide_handle_post_fs_data();\n#endif/' KernelSU/kernel/runtime/ksud.c
          sed -i 's/            ksu_selinux_hide_handle_second_stage();/#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n            ksu_selinux_hide_handle_second_stage();\n#endif/' KernelSU/kernel/runtime/ksud.c
          sed -i 's/                ksu_selinux_hide_handle_second_stage();/#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n                ksu_selinux_hide_handle_second_stage();\n#endif/' KernelSU/kernel/runtime/ksud.c
          # 4.19 compat: USER_ARG_NULL returns pointer but ksu_sulog_capture expects value
          sed -i 's/#define USER_ARG_NULL user_arg_null_ptr()/#define USER_ARG_NULL (*user_arg_null_ptr())/' KernelSU/kernel/sulog/event.c
          # Fix version mismatch: Manager sends version 3, kernel expects version 4
          # Add forward declaration for migrate_profile (defined after ksu_set_app_profile)
          sed -i 's/int ksu_set_app_profile(struct app_profile \*profile)/static void migrate_profile(u32 version, struct app_profile *profile);\nint ksu_set_app_profile(struct app_profile *profile)/' KernelSU/kernel/policy/allowlist.c
          sed -i '/if (!profile_valid(profile)) {/i\    if (profile->version < KSU_APP_PROFILE_VER) {\n        migrate_profile(profile->version, profile);\n    }' KernelSU/kernel/policy/allowlist.c
          cd ..

      - name: Apply Root Method ReSukiSU
        if: github.event.inputs.ksu_target == 'ReSukiSU'
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          cd ..

      - name: Build Kernel KSU SUSFS
        id: build_timer
        run: |
          BUILD_START=$(date +%s)

          DEFCONFIG=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '."ksu-defconfig"')

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/llvm/bin:$PATH"
          export KBUILD_BUILD_USER="youffx"
          export KBUILD_BUILD_HOST="collection"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=10G
          export KBUILD_CFLAGS="-mllvm -enable-ml-inliner=release -mllvm -enable-ml-regalloc=release"

          ccache -s

          cd kernel

          make O=out $DEFCONFIG
          make O=out olddefconfig

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz-dtb

          BUILD_END=$(date +%s)
          echo "duration=$((BUILD_END - BUILD_START))" >> $GITHUB_OUTPUT

      - name: Package Flashable Zip (KSU SUSFS)
        run: |
          DATE=$(TZ='Asia/Jakarta' date +"%Y%m%d-%H%M")
          KSU_TARGET="${{ github.event.inputs.ksu_target }}"
          case "$KSU_TARGET" in
            "KernelSU-Next") KSU_NAME="KSU" ;;
            "ReSukiSU") KSU_NAME="ReSukiSU" ;;
            "SukiSU") KSU_NAME="SukiSU" ;;
            *) KSU_NAME="KSU" ;;
          esac
          ZIP_NAME="Lineage-23.2-${KSU_NAME}-SUSFS-${DATE}"

          IMAGE="kernel/out/arch/arm64/boot/Image.gz-dtb"
          mkdir -p output
          cp "$IMAGE" .github/Flash/kernels/

          cd .github/Flash/
          zip -r "../../output/${ZIP_NAME}.zip" ./*
          cd ../../

      - name: Calculate Metadata
        id: calc
        run: |
          DIFF=${{ steps.build_timer.outputs.duration }}
          MIN=$((DIFF / 60))
          SEC=$((DIFF % 60))
          echo "duration=${MIN}m ${SEC}s" >> $GITHUB_OUTPUT
          HASH=$(md5sum output/*.zip | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Upload ZIP
        uses: actions/upload-artifact@v5
        with:
          name: zip-ksu-susfs
          path: output/*.zip
          retention-days: 7

      - name: Show ccache statistics
        run: ccache -s

      - name: Get Kernel Info
        id: kinfo
        run: |
          cd kernel
          echo "commit=$(git log -1 --format='%h %s')" >> $GITHUB_OUTPUT
          echo "version=$(make kernelversion)" >> $GITHUB_OUTPUT
          echo "compiler=$($GITHUB_WORKSPACE/clang/bin/clang --version | head -n 1 | cut -d'(' -f1)" >> $GITHUB_OUTPUT

# =========================
# RELEASE
# =========================
  release:
    name: Release
    needs: [detect-missing-cache, build-ksu, build-nonksu, build-nomount, build-ksu-susfs]
    if: >-
      always() &&
      needs.detect-missing-cache.outputs.all_found == 'true' &&
      needs.build-ksu.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Collect ZIPs
        run: |
          mkdir -p final
          find . -name "*.zip" -path "*/zip-*/*" -exec cp {} final/ \;

      - name: Verify ZIPs exist
        run: |
          if [ -z "$(ls -A final/*.zip 2>/dev/null)" ]; then
            echo "No ZIP files found!"
            exit 1
          fi
          echo "ZIPs to release:"
          ls -lh final/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Release-${{ github.run_id }}
          name: Kernel Release${{ github.event.inputs.pre_release == 'true' && ' (Pre-Release)' || '' }}
          prerelease: ${{ github.event.inputs.pre_release == 'true' }}
          body: |
            ### Lineage Kernel Release${{ github.event.inputs.pre_release == 'true' && ' (Pre-Release)' || '' }}

            **Build Details:**
            - Kernel Version: `${{ needs.build-ksu.outputs.kern_ver }}`
            - Compiler: `${{ needs.build-ksu.outputs.compiler_ver }}`
            - Root Method: `${{ github.event.inputs.ksu_target }}`
            - Support EROFS
            - Support both AOSP & NON-AOSP
            - Sync with latest Lineage 23.2 kernel source

            **Build Statistics:**
            | Variant | Build Time | MD5 Hash |
            |---------|------------|----------|
            | KSU | ${{ needs.build-ksu.outputs.build_time }} | `${{ needs.build-ksu.outputs.zip_hash }}` |
            | Non-KSU | ${{ needs.build-nonksu.outputs.build_time }} | `${{ needs.build-nonksu.outputs.zip_hash }}` |
            | KSU NoMount | ${{ needs.build-nomount.outputs.build_time }} | `${{ needs.build-nomount.outputs.zip_hash }}` |
            | KSU SUSFS | ${{ needs.build-ksu-susfs.outputs.build_time }} | `${{ needs.build-ksu-susfs.outputs.zip_hash }}` |

            **Latest Commit:** `${{ needs.build-ksu.outputs.commit_log }}`
          files: final/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notification
        if: always()
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
        run: |
          tg() {
            curl -sX POST https://api.telegram.org/bot"${TOKEN}"/sendMessage \
              -d chat_id="${CHATID}" \
              -d parse_mode=Markdown \
              -d disable_web_page_preview=true \
              -d text="$1"
          }

          BUILD_DATE=$(date +"%a %b %d %H:%M:%S %Z %Y")
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/Release-${{ github.run_id }}"

          if [ "${{ needs.build-ksu.result }}" == "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi

          MESSAGE="*Lineage CI Release*
          *Status:* $STATUS
          *Kernel Version:* \`${{ needs.build-ksu.outputs.kern_ver }}\`
          *Compiler:* \`${{ needs.build-ksu.outputs.compiler_ver }}\`
          *Date:* \`$BUILD_DATE\`
          *Root Method:* \`${{ github.event.inputs.ksu_target }}\`
          *Build Variants:* \`KSU, Non-KSU, KSU NoMount, KSU SUSFS\`
          *Latest Commit:* \`${{ needs.build-ksu.outputs.commit_log }}\`
          *Build Statistics:*
          • *KSU:* *${{ needs.build-ksu.outputs.build_time }}* | *md5:* \`${{ needs.build-ksu.outputs.zip_hash }}\`
          • *Non-KSU:* *${{ needs.build-nonksu.outputs.build_time }}* | *md5:* \`${{ needs.build-nonksu.outputs.zip_hash }}\`
          • *KSU NoMount:* *${{ needs.build-nomount.outputs.build_time }}* | *md5:* \`${{ needs.build-nomount.outputs.zip_hash }}\`
          • *KSU SUSFS:* *${{ needs.build-ksu-susfs.outputs.build_time }}* | *md5:* \`${{ needs.build-ksu-susfs.outputs.zip_hash }}\`

          [Check Release]($RELEASE_URL)"

          tg "$MESSAGE"

# =========================
# RETRIGGER (cache prime)
# =========================
  retrigger:
    name: Retrigger Workflow
    needs: [detect-missing-cache, build-ksu, build-nonksu, build-nomount, build-ksu-susfs]
    if: >-
      always() &&
      needs.detect-missing-cache.outputs.all_found == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.ACTION_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches \
            -d '{"ref":"master","inputs":{"ksu_target":"${{ github.event.inputs.ksu_target }}","pre_release":"${{ github.event.inputs.pre_release }}"}}'

name: Repo
on:
  workflow_dispatch:
jobs:
  copy-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and Push
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          git clone --bare --progress https://github.com/PQEnablers-Devices/android_kernel_mediatek_5.10.git
          cd android_kernel_mediatek_5.10.git
          git remote add target https://${{ secrets.REPO_A_PAT }}@github.com/Youffx/kernel_xiaomi_rosemary_5.10.git
          git log --reverse --format=%H HEAD | awk 'NR % 15000 == 0' > chunks.txt
          git rev-parse HEAD >> chunks.txt
          while read commit; do
            git push target $commit:refs/heads/temp-branch --force --progress
          done < chunks.txt
          git push target --mirror --force --progress
          

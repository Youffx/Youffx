name: Merge ZIP

on:
  workflow_dispatch:
    inputs:
      repo_target:
        description: "Target Repository"
        required: true
        type: choice
        options:
          - "5.10"
          - "4.19"
          - "kernelsu"
      branch:
        description: "Target branch"
        required: true
      title:
        description: "Commit title and description (split with /)"
        required: true
      zip_url:
        description: "ZIP URL"
        required: false
      repo_paths:
        description: "Repo URLs (space separated)"
        required: false
      diff_urls:
        description: "Diff URLs (space separated)"
        required: false

jobs:
  merging:
    runs-on: ubuntu-latest

    steps:
      - name: Restore Repo Cache
        uses: actions/cache@v4
        with:
          path: repo
          key: repo-${{ github.event.inputs.repo_target }}-${{ github.event.inputs.branch }}

      - name: Prepare Repository
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          TARGET_REPO="${{ github.event.inputs.repo_target }}"
          if [ "$TARGET_REPO" = "5.10" ]; then
            REPO_NAME="android_kernel_xiaomi_mt6785_5.10"
          elif [ "$TARGET_REPO" = "4.19" ]; then
            REPO_NAME="kernel_xiaomi_rosemary"
          else
            REPO_NAME="Kernelsu-Next"
          fi
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

          INPUT="${{ github.event.inputs.branch }}"
          REPO_URL="https://x-access-token:${PAT_TOKEN}@github.com/Youffx/${REPO_NAME}.git"

          PARTS=($INPUT)

          if [ ${#PARTS[@]} -eq 2 ]; then
            TARGET="${PARTS[0]}"
            CUSTOM_BRANCH="${PARTS[1]}"
          else
            TARGET="$INPUT"
            CUSTOM_BRANCH=""
          fi

          if [ -d "repo/.git" ]; then
            cd repo
            git remote set-url origin $REPO_URL
            git fetch origin --prune
          else
            git clone $REPO_URL repo
            cd repo
          fi

          git fetch origin --tags

          if git ls-remote --heads origin "$TARGET" | grep -q "refs/heads/$TARGET"; then
            git checkout -B "$TARGET" "origin/$TARGET"
            git pull origin "$TARGET" --rebase || true
            echo "WORK_BRANCH=$TARGET" >> $GITHUB_ENV
          else
            git fetch origin "$TARGET" || true

            if [ -n "$CUSTOM_BRANCH" ]; then
              NEW_BRANCH="$CUSTOM_BRANCH"
            else
              NEW_BRANCH="merge-${TARGET:0:7}"
          fi

            git checkout -b "$NEW_BRANCH" "$TARGET"
            echo "WORK_BRANCH=$NEW_BRANCH" >> $GITHUB_ENV
          fi

      - name: Configure Git + Import GPG
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "default-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
          echo "max-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

          echo "${{ secrets.GPG_PRIVATE_KEY }}" > private.key
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --import private.key
          rm -f private.key

          gpgconf --kill gpg-agent
          gpg-connect-agent reloadagent /bye

          echo "test" | gpg --clearsign --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" > /dev/null

          git config --global user.name "${{ secrets.USER }}"
          git config --global user.email "${{ secrets.EMAIL }}"
          git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global gpg.program gpg

      - name: Apply ZIP
        if: ${{ github.event.inputs.zip_url != '' }}
        run: |
          cd repo

          ZIP_URL="${{ github.event.inputs.zip_url }}"
          TITLE_INPUT="${{ github.event.inputs.title }}"

          TEMP_DIR="/tmp/zip_overlay"
          ZIP_FILE="/tmp/overlay.zip"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          if echo "$ZIP_URL" | grep -q "drive.google.com"; then
            FILE_ID=$(echo "$ZIP_URL" | sed -n 's#.*\/d\/\([^/]*\)\/.*#\1#p')

            curl -L \
              "https://drive.google.com/uc?export=download&id=$FILE_ID" \
              -o "$ZIP_FILE"
          else
            curl -L "$ZIP_URL" -o "$ZIP_FILE"
          fi

          unzip -o "$ZIP_FILE" -d "$TEMP_DIR"

          cp -rf "$TEMP_DIR"/. .

          git add -A

          if ! git diff --cached --quiet; then

            IFS='/' read -ra MSG <<< "$TITLE_INPUT"

            COMMIT_TITLE="${MSG[0]}"

            COMMIT_BODY=""

            if [ ${#MSG[@]} -gt 1 ]; then
              for ((i=1;i<${#MSG[@]};i++))
              do
                COMMIT_BODY+="${MSG[$i]}"$'\n'
              done
            fi

            if [ -n "$COMMIT_BODY" ]; then
              FINAL_MSG="${COMMIT_TITLE}"$'\n\n'"${COMMIT_BODY}"$'\n'"Signed-off-by: Youffx <asa.jazal@gmail.com>"
            else
              FINAL_MSG="${COMMIT_TITLE}"$'\n\n'"Signed-off-by: Youffx <asa.jazal@gmail.com>"
            fi

            git commit -m "$FINAL_MSG"
          else
            echo "No overlay changes detected"
          fi

          rm -rf "$TEMP_DIR"
          rm -f "$ZIP_FILE"

      - name: Merge Repository Paths
        if: ${{ github.event.inputs.repo_paths != '' }}
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          cd repo

          INPUT="${{ github.event.inputs.repo_paths }}"
          TITLE_INPUT="${{ github.event.inputs.title }}"

          for URL in $INPUT
          do
            echo "Processing $URL"

            CLEAN=$(echo "$URL" | sed 's#https://github.com/##')

            OWNER=$(echo "$CLEAN" | cut -d/ -f1)
            REPO=$(echo "$CLEAN" | cut -d/ -f2)
            TYPE=$(echo "$CLEAN" | cut -d/ -f3)
            BRANCH=$(echo "$CLEAN" | cut -d/ -f4)

            SRC_DIR=$(echo "$CLEAN" | cut -d/ -f5-)
            CLONE_DIR="/tmp/src_${RANDOM}"

            if [ "$OWNER/$REPO" = "Youffx/kernel_xiaomi_rosemary" ]; then
              REPO_URL="https://x-access-token:${PAT_TOKEN}@github.com/$OWNER/$REPO.git"
            else
              REPO_URL="https://github.com/$OWNER/$REPO.git"
            fi

            git clone \
              --depth=1 \
              --branch "$BRANCH" \
              "$REPO_URL" \
              "$CLONE_DIR"

            SOURCE="$CLONE_DIR/$SRC_DIR"

            if [ "$TYPE" = "tree" ]; then

              if [ ! -d "$SOURCE" ]; then
                echo "Folder not found: $SRC_DIR"
                rm -rf "$CLONE_DIR"
                continue
              fi

              TARGET=$(basename "$SRC_DIR")

              mkdir -p "./$TARGET"

              cp -rf "$SOURCE"/. "./$TARGET"/

            elif [ "$TYPE" = "blob" ]; then

              if [ ! -f "$SOURCE" ]; then
                echo "File not found: $SRC_DIR"
                rm -rf "$CLONE_DIR"
                continue
              fi

              TARGET_DIR=$(dirname "$SRC_DIR")

              mkdir -p "./$TARGET_DIR"

              cp -f "$SOURCE" "./$SRC_DIR"

            else
              echo "Unsupported URL"
            fi

            rm -rf "$CLONE_DIR"
          done

          git add -A

          if ! git diff --cached --quiet; then

            IFS='/' read -ra MSG <<< "$TITLE_INPUT"

            COMMIT_TITLE="${MSG[0]}"
            COMMIT_BODY=""

            if [ ${#MSG[@]} -gt 1 ]; then
              for ((i=1;i<${#MSG[@]};i++))
              do
                COMMIT_BODY+="${MSG[$i]}"$'\n'
              done
            fi

            if [ -n "$COMMIT_BODY" ]; then
              FINAL_MSG="${COMMIT_TITLE}"$'\n\n'"${COMMIT_BODY}"$'\n'"Signed-off-by: Youffx <asa.jazal@gmail.com>"
            else
              FINAL_MSG="${COMMIT_TITLE}"$'\n\n'"Signed-off-by: Youffx <asa.jazal@gmail.com>"
            fi

            git commit -m "$FINAL_MSG"
          else
            echo "No repo changes"
          fi

      - name: Apply Diff Patches
        if: ${{ github.event.inputs.diff_urls != '' }}
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          cd repo

          INPUT="${{ github.event.inputs.diff_urls }}"
          TITLE_INPUT="${{ github.event.inputs.title }}"

          for URL in $INPUT
          do
            TEMP_DIFF="/tmp/patch_${RANDOM}.diff"

            if echo "$URL" | grep -q "github.com/Youffx/"; then
              if echo "$URL" | grep -q "/commit/"; then
                REPO=$(echo "$URL" | sed -n 's#.*github.com/Youffx/\([^/]*\)/commit/.*#\1#p')
                SHA=$(echo "$URL" | sed -n 's#.*/commit/\([a-f0-9]*\).*#\1#p')
                curl -sL -H "Authorization: token $PAT_TOKEN" -H "Accept: application/vnd.github.v3.diff" "https://api.github.com/repos/Youffx/${REPO}/commits/${SHA}" -o "$TEMP_DIFF"
              else
                curl -sL "$URL" -o "$TEMP_DIFF"
              fi
            elif echo "$URL" | grep -q "drive.google.com"; then
              FILE_ID=$(echo "$URL" | sed -n 's#.*\/d\/\([^/]*\)\/.*#\1#p')
              curl -sL "https://drive.google.com/uc?export=download&id=$FILE_ID" -o "$TEMP_DIFF"
            else
              curl -sL "$URL" -o "$TEMP_DIFF"
            fi

            if [ -s "$TEMP_DIFF" ] && ! grep -q "DOCTYPE html" "$TEMP_DIFF"; then
              git apply "$TEMP_DIFF" || patch -p1 < "$TEMP_DIFF"
            fi

            rm -f "$TEMP_DIFF"
          done

          git add -A

          if ! git diff --cached --quiet; then

            IFS='/' read -ra MSG <<< "$TITLE_INPUT"

            COMMIT_TITLE="${MSG[0]}"
            COMMIT_BODY=""

            if [ ${#MSG[@]} -gt 1 ]; then
              for ((i=1;i<${#MSG[@]};i++))
              do
                COMMIT_BODY+="${MSG[$i]}"$'\n'
              done
            fi

            if [ -n "$COMMIT_BODY" ]; then
              FINAL_MSG="${COMMIT_TITLE}"$'\n\n'"${COMMIT_BODY}"$'\n'"Signed-off-by: Youffx <asa.jazal@gmail.com>"
            else
              FINAL_MSG="${COMMIT_TITLE}"$'\n\n'"Signed-off-by: Youffx <asa.jazal@gmail.com>"
            fi

            git commit -m "$FINAL_MSG"
          fi

      - name: Push to Repository
        if: success()
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          cd repo

          git config core.compression 9
          git config pack.window 250
          git config pack.depth 250
          git config http.postBuffer 2147483648
          git config http.version HTTP/1.1

          git gc --aggressive --prune=now

          git remote set-url origin \
          https://x-access-token:${PAT_TOKEN}@github.com/Youffx/${REPO_NAME}.git

          git push origin $WORK_BRANCH

      - name: Save Repo Cache
        uses: actions/cache@v4
        with:
          path: repo
          key: repo-${{ github.event.inputs.repo_target }}-${{ github.event.inputs.branch }}

      - name: Notification
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
        run: |
          MESSAGE="*Merge done sir..*"

          curl -sX POST \
          https://api.telegram.org/bot${TOKEN}/sendMessage \
          -d chat_id="${CHATID}" \
          -d parse_mode=Markdown \
          --data-urlencode text="$MESSAGE"
          

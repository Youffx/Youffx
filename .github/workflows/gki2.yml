name: 5.10 non-GKI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev lzop rsync zip zlib1g-dev jq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Youffx/android_kernel_xiaomi_mt6785_5.10
          ref: experimental
          path: kernel
          fetch-depth: 1

      - name: Cache Clang 18
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm
          key: llvm-r522817

      - name: Setup Clang 18
        run: |
          if [ ! -d "llvm/bin" ]; then
            export LLVM_DIR="$PWD/llvm"
            rm -rf "$LLVM_DIR"
            mkdir -p "$LLVM_DIR"
            wget -qO- "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz" | tar xz -C "$LLVM_DIR"
          fi
          echo "$PWD/llvm/bin" >> $GITHUB_PATH

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-rosemary-${{ github.sha }}
          restore-keys: |
            ccache-rosemary-

      - name: Setup Ccache
        run: |
          mkdir -p ~/.cache/ccache
          echo "max_size = 2.0G" > ~/.cache/ccache/ccache.conf
          echo "compression = true" >> ~/.cache/ccache/ccache.conf

      - name: Build Kernel
        id: build_kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="ccache clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          cd kernel
          
          START_TIME=$(date +%s)
          
          COMMIT_LOG=$(git log -1 --format="%s" | cut -c1-50)
          echo "commit_log=$COMMIT_LOG" >> $GITHUB_OUTPUT
          
          make O=out rosemary_defconfig CC="ccache clang"
          make O=out -j$(nproc) Image.gz-dtb CC="ccache clang"
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          
          KERNEL_VERSION=$(VERSION_FILE=out/include/config/kernel.release; if [ -f "$VERSION_FILE" ]; then cat "$VERSION_FILE"; else echo "5.10"; fi)
          COMPILER_VERSION=$($PWD/../llvm/bin/clang --version | head -n 1)
          
          echo "kern_ver=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "compiler_ver=$COMPILER_VERSION" >> $GITHUB_OUTPUT
          echo "build_time=${MINUTES}m ${SECONDS}s" >> $GITHUB_OUTPUT
          
          cd ..

      - name: Package Flashable Zip NONKSU
        id: package
        run: |
          DATE=$(TZ='Asia/Jakarta' date +"%Y%m%d-%H%M")
          ZIP_NAME="stage-2-kernel-5.10-${DATE}"
          IMAGE="kernel/out/arch/arm64/boot/Image.gz-dtb"
          
          mkdir -p output
          mkdir -p .github/Flash/kernels
          cp "$IMAGE" .github/Flash/kernels/
          
          cd .github/Flash
          zip -r "../../output/${ZIP_NAME}.zip" ./*
          cd ../../
          
          ZIP_HASH=$(sha256sum output/${ZIP_NAME}.zip | awk '{print $1}')
          echo "zip_hash=$ZIP_HASH" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: Release-${{ github.run_id }}
          name: Pre-release
          body: |
            **Rosemary 5.10**
          files: output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notification
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
        run: |
          tg() {
            curl -sX POST https://api.telegram.org/bot"${TOKEN}"/sendMessage \
              -d chat_id="${CHATID}" \
              -d parse_mode=Markdown \
              -d disable_web_page_preview=true \
              -d text="$1"
          }
          
          BUILD_DATE=$(TZ='Asia/Jakarta' date +"%a %b %d %H:%M:%S WIB %Y")
          
          MESSAGE="*Pre Release*
          *Kernel Version:* \`${{ steps.build_kernel.outputs.kern_ver }}\`
          *Compiler:* \`${{ steps.build_kernel.outputs.compiler_ver }}\`
          *Date:* \`$BUILD_DATE\`
          *Latest Commit:* \`${{ steps.build_kernel.outputs.commit_log }}\`
          *Build Statistics:*
          • *5.10:* *${{ steps.build_kernel.outputs.build_time }}* | *sha256:* \`${{ steps.package.outputs.zip_hash }}\`
          
          [Check Release](https://github.com/${{ github.repository }}/releases/tag/Release-${{ github.run_id }})"
          
          tg "$MESSAGE"
          

name: Cherry Pick & Revert

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Target branch"
        required: true
      source:
        description: "Source repo (format: user/repo)"
        required: false
      commits:
        description: "Cherry-pick"
        required: false
      patch_urls:
        description: "Patch URLs"
        required: false
      merge:
        description: "Large Patch multi-commit"
        required: false
      zip_url:
        description: "ZIP URL"
        required: false
      revert_commits:
        description: "Revert commit"
        required: false
      exclude_files:
        description: "exclude Files"
        required: false

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Restore Repo Cache
        uses: actions/cache@v4
        with:
          path: repo
          key: repo-${{ github.event.inputs.branch }}

      - name: Prepare Repository
        run: |
          INPUT="${{ github.event.inputs.branch }}"
          REPO_URL="https://github.com/Youffx/kernel_xiaomi_rosemary.git"

          PARTS=($INPUT)

          if [ ${#PARTS[@]} -eq 2 ]; then
            TARGET="${PARTS[0]}"
            CUSTOM_BRANCH="${PARTS[1]}"
          else
            TARGET="$INPUT"
            CUSTOM_BRANCH=""
          fi

          echo "TARGET=$TARGET"
          echo "CUSTOM_BRANCH=$CUSTOM_BRANCH"

          if [ -d "repo/.git" ]; then
            echo "Using cached repository..."
            cd repo
            git remote set-url origin $REPO_URL
            git fetch origin --prune
          else
            echo "Cloning fresh repository..."
            git clone $REPO_URL repo
            cd repo
          fi

          git fetch origin --tags

          if git ls-remote --heads origin "$TARGET" | grep -q "refs/heads/$TARGET"; then
            git checkout -B "$TARGET" "origin/$TARGET"
            git pull origin "$TARGET" --rebase || true
            echo "WORK_BRANCH=$TARGET" >> $GITHUB_ENV
          else
            git fetch origin "$TARGET" || true

            if [ -n "$CUSTOM_BRANCH" ]; then
              NEW_BRANCH="$CUSTOM_BRANCH"
            else
              NEW_BRANCH="cherry-pick-${TARGET:0:7}"
            fi

            git checkout -B "$NEW_BRANCH" "$TARGET"
            echo "WORK_BRANCH=$NEW_BRANCH" >> $GITHUB_ENV
          fi

      - name: Add Source Repository
        if: ${{ github.event.inputs.source != '' }}
        run: |
          cd repo
          git remote remove source || true
          git remote add source https://github.com/${{ github.event.inputs.source }}.git
          git fetch source

      - name: Configure Git + Import GPG
        run: |
          git config --global user.name "${{ secrets.USER }}"
          git config --global user.email "${{ secrets.EMAIL }}"

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "default-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
          echo "max-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

          echo "${{ secrets.GPG_PRIVATE_KEY }}" > private.key
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --import private.key
          rm -f private.key

          gpgconf --kill gpg-agent
          gpg-connect-agent reloadagent /bye

          echo "test" | gpg --clearsign --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" > /dev/null

          git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global gpg.program gpg

      - name: Revert Commits
        if: ${{ github.event.inputs.revert_commits != '' }}
        run: |
          cd repo

          for commit in ${{ github.event.inputs.revert_commits }}
          do
            echo "Reverting $commit"

            git revert --no-commit $commit || true

            if [ -n "${{ github.event.inputs.exclude_files }}" ]; then
              for file in ${{ github.event.inputs.exclude_files }}
              do
                git checkout HEAD -- "$file" || true
              done
            fi

            git add .
            ORIG_SUBJECT=$(git log -1 --pretty=%s $commit)
            git commit -m "Revert \"$ORIG_SUBJECT\""$'\n\n'"This reverts commit $commit." || true
          done

      - name: Cherry Pick Commits
        if: ${{ github.event.inputs.commits != '' }}
        run: |
          cd repo

          CONFLICT_COUNT=0
          CONFLICT_FILES=""

          for commit in ${{ github.event.inputs.commits }}
          do
            echo "Cherry-picking $commit"

            git cherry-pick -n $commit || true

            CONFLICTED=$(git diff --name-only --diff-filter=U)

            if [ -n "$CONFLICTED" ]; then
              echo "Conflict detected in:"
              echo "$CONFLICTED"

              CONFLICT_COUNT=$((CONFLICT_COUNT + 1))
              CONFLICT_FILES+=$'Commit '$commit$':\n'$CONFLICTED$'\n\n'
            fi

            if [ -n "${{ github.event.inputs.exclude_files }}" ]; then
              for file in ${{ github.event.inputs.exclude_files }}
              do
                git checkout HEAD -- "$file" || true
              done
            fi

            AUTHOR=$(git log -1 --pretty='%an <%ae>' $commit)
            COMMIT_MSG=$(git log -1 --pretty=%B $commit)

            if echo "$COMMIT_MSG" | grep -q "Signed-off-by:" && ! echo "$COMMIT_MSG" | grep -q "Signed-off-by: Youffx <asa.jazal@gmail.com>"; then
              COMMIT_MSG="$COMMIT_MSG"$'\n'"Signed-off-by: Youffx <asa.jazal@gmail.com>"
            fi

            git add -A
            echo "$COMMIT_MSG" | git commit --author="$AUTHOR" -F - || true
          done

          echo "CONFLICT_COUNT=$CONFLICT_COUNT" >> $GITHUB_ENV
          echo "CONFLICT_FILES<<EOF" >> $GITHUB_ENV
          echo "$CONFLICT_FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
      - name: Apply Patch URLs
        if: ${{ github.event.inputs.patch_urls != '' }}
        run: |
          cd repo

          mkdir -p ../patch_rejects

          IFS=' ' read -r -a PATCH_LIST <<< "${{ github.event.inputs.patch_urls }}"

          for patch_url in "${PATCH_LIST[@]}"
          do
            echo "Applying patch: $patch_url"

            RAW_URL="$patch_url"

            SAFE_NAME=$(echo "$RAW_URL" | sed 's/[?&=/:]/_/g')
            PATCH_NAME=$(basename "$SAFE_NAME")
            TEMP_PATCH="/tmp/${PATCH_NAME}.patch"

            if echo "$RAW_URL" | grep -q "github.com"; then
              if echo "$RAW_URL" | grep -q "/commit/"; then
                RAW_URL="${RAW_URL}.patch"
              else
                RAW_URL=$(echo "$RAW_URL" | sed 's|https://github.com/|https://raw.githubusercontent.com/|' | sed 's|/blob/|/|')
              fi
            fi

            if echo "$RAW_URL" | grep -q "git.kernel.org"; then
              RAW_URL=$(echo "$RAW_URL" | sed 's|/commit/|/patch/?id=|')
            fi

            echo "Downloading from: $RAW_URL"

            curl -L --fail "$RAW_URL" -o "$TEMP_PATCH" || {
              echo "Download failed: $patch_url"
              continue
            }

            git reset --hard HEAD || true

            if git am --3way "$TEMP_PATCH"; then

              git commit --amend -C HEAD --no-edit --trailer "Signed-off-by: Youffx <asa.jazal@gmail.com>" || true

              LAST_MSG=$(git log -1 --pretty=%B)
              CLEAN_MSG=$(printf "%s" "$LAST_MSG" | sed 's/  / /g')

              printf "%s" "$CLEAN_MSG" | git commit --amend -F -

            else
              echo "Patch FAILED → SKIP: $PATCH_NAME"

              git am --abort || true
              git reset --hard HEAD || true

              if echo "$RAW_URL" | grep -q "git.kernel.org"; then
                echo "Skip saving reject for kernel.org"
              else
                cp "$TEMP_PATCH" ../patch_rejects/ || true
              fi
            fi

            rm -f "$TEMP_PATCH"
          done

      - name: Apply Merge Patch Series
        if: ${{ github.event.inputs.merge != '' }}
        run: |
          cd repo

          mkdir -p ../merge_rejects

          MERGE_FAIL_FILE="../merge_fail_info.txt"
          echo "" > "$MERGE_FAIL_FILE"

          IFS=' ' read -r -a MERGE_LIST <<< "${{ github.event.inputs.merge }}"

          MERGE_FAIL_COUNT=0

          for merge_url in "${MERGE_LIST[@]}"
          do
            echo "Processing merge patch: $merge_url"

            RAW_URL="$merge_url"

            SAFE_NAME=$(echo "$RAW_URL" | sed 's/[?&=/:]/_/g')
            PATCH_NAME=$(basename "$SAFE_NAME")
            TEMP_PATCH="/tmp/${PATCH_NAME}.patch"

            if echo "$RAW_URL" | grep -q "github.com"; then
              RAW_URL=$(echo "$RAW_URL" \
                | sed 's|https://github.com/|https://raw.githubusercontent.com/|' \
                | sed 's|/blob/|/|')
            fi

            echo "Downloading: $RAW_URL"

            curl -L --fail "$RAW_URL" -o "$TEMP_PATCH" || {
              echo "Failed downloading: $merge_url"
              continue
            }

            git reset --hard HEAD
            git clean -fd

            echo "Splitting patch series..."

            csplit -s -f /tmp/merge_split_ "$TEMP_PATCH" \
              '/^From [0-9a-f]\{40\} Mon Sep 17 00:00:00 2001$/' '{*}' || true

            SPLIT_PATCHES=$(find /tmp -maxdepth 1 -name 'merge_split_*' | sort)

            for split_patch in $SPLIT_PATCHES
            do
              if [ ! -s "$split_patch" ]; then
                continue
              fi

              SUBJECT=$(grep -m1 "^Subject:" "$split_patch" \
                | sed 's/^Subject:[[:space:]]*//')

              echo "Applying commit: $SUBJECT"

              git reset --hard HEAD
              git clean -fd

              BEFORE_COMMIT=$(git rev-parse HEAD)

              AM_SUCCESS=false

              if git am --3way "$split_patch"; then
                AM_SUCCESS=true
              else
                echo "Application failed, checking for conflicts..."

                if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                  echo "Executing smart conflict resolver..."
                  git diff --name-only --diff-filter=U | while read -r file; do
                    python3 ../.github/scripts/smart_resolve.py "$file" "$split_patch"
                    git add "$file"
                  done

                  if git -c core.editor=true am --continue; then
                    AM_SUCCESS=true
                  fi
                else
                  echo "No conflict markers found, attempting fallback application..."
                  git am --abort 2>/dev/null || true
                  git reset --hard "$BEFORE_COMMIT"
                  git clean -fd

                  if git apply --ignore-whitespace "$split_patch"; then
                    echo "Fallback git apply successful"
                    git add -A
                    if git commit -m "$SUBJECT"; then
                      AM_SUCCESS=true
                    fi
                  else
                    echo "Fallback git apply failed, trying patch utility..."
                    if patch -p1 --fuzz=3 --no-backup-if-mismatch < "$split_patch"; then
                      if [ -z "$(find . -name '*.rej')" ]; then
                        find . -name '*.orig' -delete
                        git add -A
                        if git commit -m "$SUBJECT"; then
                          AM_SUCCESS=true
                        fi
                      else
                        echo "Patch contains rejects, clearing..."
                        find . -name '*.rej' -exec cp {} ../merge_rejects/ \;
                        find . -name '*.rej' -delete
                        find . -name '*.orig' -delete
                      fi
                    fi
                  fi
                fi
              fi

              if [ "$AM_SUCCESS" = "true" ]; then

                if [ -n "${{ github.event.inputs.exclude_files }}" ]; then
                  for file in ${{ github.event.inputs.exclude_files }}
                  do
                    git checkout HEAD -- "$file" || true
                  done

                  git add -A

                  if ! git diff --cached --quiet; then
                    git commit --amend --no-edit || true
                  fi
                fi

                git commit --amend -C HEAD --no-edit \
                  --trailer "Signed-off-by: Youffx <asa.jazal@gmail.com>" || true

                LAST_MSG=$(git log -1 --pretty=%B)
                CLEAN_MSG=$(printf "%s" "$LAST_MSG" | sed 's/  / /g')

                printf "%s" "$CLEAN_MSG" | git commit --amend -F -

                echo "Commit applied successfully"

              else
                echo "Commit FAILED -> SKIPPED"

                git am --abort 2>/dev/null || true
                git reset --hard "$BEFORE_COMMIT"
                git clean -fd

                MERGE_FAIL_COUNT=$((MERGE_FAIL_COUNT + 1))

                FAILED_SUBJECT=$(echo "$SUBJECT" | tr -d '\r')

                echo -e "FAILED:\n$FAILED_SUBJECT\n" >> "$MERGE_FAIL_FILE"

                cp "$split_patch" ../merge_rejects/ \
                  "$(basename "$split_patch").patch" || true
              fi
            done

            rm -f "$TEMP_PATCH"
            rm -f /tmp/merge_split_*
          done

          echo "MERGE_FAIL_COUNT=$MERGE_FAIL_COUNT" >> $GITHUB_ENV

      - name: Apply ZIP Overlay
        if: ${{ github.event.inputs.zip_url != '' }}
        run: |
          cd repo

          ZIP_URL="${{ github.event.inputs.zip_url }}"
          TEMP_DIR="/tmp/zip_overlay"
          ZIP_FILE="/tmp/overlay.zip"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          if echo "$ZIP_URL" | grep -q "drive.google.com"; then
            FILE_ID=$(echo "$ZIP_URL" | sed -n 's#.*\/d\/\([^/]*\)\/.*#\1#p')

            curl -L "https://drive.google.com/uc?export=download&id=$FILE_ID" \
              -o "$ZIP_FILE"
          else
            curl -L "$ZIP_URL" -o "$ZIP_FILE"
          fi

          unzip -o "$ZIP_FILE" -d "$TEMP_DIR"

          cp -rf "$TEMP_DIR"/. .

          if [ -n "${{ github.event.inputs.exclude_files }}" ]; then
            for file in ${{ github.event.inputs.exclude_files }}
            do
              git checkout HEAD -- "$file" || true
            done
          fi

          git add -A

          if ! git diff --cached --quiet; then
            BASE_HEAD=$(git rev-parse --short HEAD)

            git commit -m "kernel: sync overlay adjustments from latest upstream state"$'\n\n'"Continuation and compatibility adjustments based on latest HEAD commits."$'\n'"Base HEAD: $BASE_HEAD"$'\n\n'"Signed-off-by: Youffx <asa.jazal@gmail.com>" || true
          else
            echo "No overlay changes detected"
          fi

          rm -rf "$TEMP_DIR"
          rm -f "$ZIP_FILE"

      - name: Push to Repository
        if: success()
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          cd repo
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git
          git push origin $WORK_BRANCH

      - name: Upload Reject Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-reject-files
          path: patch_rejects
          if-no-files-found: ignore

      - name: Notification
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
        run: |
          tg() {
            curl -sX POST https://api.telegram.org/bot"${TOKEN}"/sendMessage \
              -d chat_id="${CHATID}" \
              -d parse_mode=Markdown \
              -d disable_web_page_preview=true \
              --data-urlencode text="$1"
          }

          BUILD_DATE=$(date +"%a %b %d %H:%M:%S %Z %Y")

          CONFLICT_COUNT="${{ env.CONFLICT_COUNT }}"
          CONFLICT_COUNT=${CONFLICT_COUNT:-0}

          if [ "$CONFLICT_COUNT" -gt 0 ]; then
            CHERRY_STATUS="⚠️ *Cherry-pick finished with conflicts*"
            CHERRY_INFO="*Conflicted files:*
          \`\`\`
          ${{ env.CONFLICT_FILES }}
          \`\`\`"
          else
            CHERRY_STATUS="✅ *Cherry-pick success (no conflicts)*"
            CHERRY_INFO=""
          fi

          PATCH_STATUS=""
          PATCH_INFO=""

          if [ -d "patch_rejects" ]; then
            REJ_FILES=$(find patch_rejects -type f)

            if [ -n "$REJ_FILES" ]; then
              PATCH_STATUS="⚠️ *Patch applied with reject files (.rej)*"

              PATCH_INFO="*Reject files:*
          \`\`\`
          $REJ_FILES
          \`\`\`

          *Artifact:* \`patch-reject-files\`"
            else
              PATCH_STATUS="✅ *All patches applied successfully*"
            fi
          else
            PATCH_STATUS="✅ *No reject files detected*"
          fi

          # ================================
          # FIX IMPORTANT: MERGE FAIL FILE
          # ================================
          MERGE_FAIL_INFO=$(cat ../merge_fail_info.txt 2>/dev/null || true)

          MESSAGE="*Cherry Pick & Patch Report*

          $CHERRY_STATUS
          $PATCH_STATUS

          *Merge Failures:*
          \`\`\`
          $MERGE_FAIL_INFO
          \`\`\`

          *Date:* \`$BUILD_DATE\`

          $CHERRY_INFO

          $PATCH_INFO"

          tg "$MESSAGE"
    
      - name: Save Repo Cache
        uses: actions/cache@v4
        with:
          path: repo
          key: repo-${{ github.event.inputs.branch }}
          

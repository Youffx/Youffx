name: Claude Code

on:
  workflow_dispatch:

jobs:
  claude-session:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Target Kernel Repository
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          rm -rf ./*

          git clone \
            --depth 1 \
            -b master-s \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Install Free Claude Code
        env:
          PATH: /home/runner/.local/bin:${PATH}
        run: |
          uv tool install free-claude-code

      - name: Configure FCC
        run: |
          mkdir -p ~/.fcc

          cat > ~/.fcc/.env <<EOF
          HOST=127.0.0.1
          PORT=8082

          ANTHROPIC_AUTH_TOKEN=fe_oa_ecf0198216093c023ae1ed4f65abcdaae2d0494052956eb5

          ZAI_API_KEY=fe_oa_ecf0198216093c023ae1ed4f65abcdaae2d0494052956eb5

          MODEL=zai/glm-5.1
          EOF

      - name: Start FCC Proxy
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          nohup fcc-server \
            > ~/fcc.log \
            2>&1 &

          for i in {1..40}; do
            if curl -fs \
              http://127.0.0.1:8082/v1/models \
              -H "x-api-key: fe_oa_ecf0198216093c023ae1ed4f65abcdaae2d0494052956eb5" \
              >/dev/null
            then
              echo "Proxy ready"
              break
            fi

            sleep 2
          done

      - name: Replace Claude Command
        run: |
          mkdir -p ~/bin

          cat > ~/bin/claude <<'EOF'
          #!/usr/bin/env bash

          export ANTHROPIC_BASE_URL=http://127.0.0.1:8082
          export ANTHROPIC_AUTH_TOKEN=fe_oa_ecf0198216093c023ae1ed4f65abcdaae2d0494052956eb5

          export CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=1
          export CLAUDE_CODE_AUTO_COMPACT_WINDOW=190000

          exec fcc-claude "$@"
          EOF

          chmod +x ~/bin/claude

          echo 'export PATH="$HOME/bin:$PATH"' >> ~/.bashrc
          echo 'export PATH="$HOME/bin:$PATH"' >> ~/.profile

      - name: Verify Claude
        run: |
          export PATH="$HOME/bin:$PATH"

          timeout 20s claude -p "reply OK" || true

      - name: Setup Tmate
        id: tmate
        uses: mxschmitt/action-tmate@v3

      - name: Send Terminal Link to Telegram
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
          SSH_URL: ${{ steps.tmate.outputs.ssh }}
        run: |
          set +x

          MESSAGE="*Claude Code Ready*
          
          • *SSH:* \`$SSH_URL\`
          
          *Cara pakai:* 
          1. SSH ke link di atas.
          2. Tekan 'q'.
          3. Ketik 'claude'."

          curl -sX POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHATID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}" > /dev/null 2>&1

      - name: Keep Session Alive
        run: |
          while true
          do
            sleep 60
          done
          

name: OpenCode

on:
 workflow_dispatch:

jobs:
 code-session:
  runs-on: ubuntu-latest
    
  steps:
  - name: Clone Target Kernel Repository
    env:
      PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
    run: |
      rm -rf ./*
      git clone --depth=1 -b master \
        https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
        kernel_xiaomi_rosemary_4.19base
      git clone --depth=1 -b lineage-21 \
        https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
        kernel_xiaomi_rosemary_5.10base

  - name: Configure Git + Import GPG
    run: |
      git config --global user.name "${{ secrets.USER }}"
      git config --global user.email "${{ secrets.EMAIL }}"

      mkdir -p ~/.gnupg
      chmod 700 ~/.gnupg

      echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
      echo "default-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
      echo "max-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
      echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

      echo "${{ secrets.GPG_PRIVATE_KEY }}" > private.key
      gpg --batch --yes --pinentry-mode loopback \
        --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
        --import private.key
      rm -f private.key

      gpgconf --kill gpg-agent
      gpg-connect-agent reloadagent /bye

      echo "test" | gpg --clearsign \
        --batch \
        --pinentry-mode loopback \
        --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
        > /dev/null

      git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"
      git config --global commit.gpgsign true
      git config --global tag.gpgsign true
      git config --global gpg.program gpg

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Cache NPM
    uses: actions/cache@v4
    with:
      path: ~/.npm
      key: ${{ runner.os }}-npm-opencode-v1
      restore-keys: |
        ${{ runner.os }}-npm-

  - name: Install OpenCode + Ponytail
    run: |
      npm i -g opencode-ai
      npm i -g @dietrichgebert/ponytail
      npm i -g rtk

  - name: Configure OpenCode
    working-directory: ${{ github.workspace }}
    run: |
      cat > opencode.json <<'EOF'
      {
        "$schema": "https://opencode.ai/config.json",
        "plugin": [
          "@dietrichgebert/ponytail"
        ]
      }
      EOF
  
  - name: Install Cloudflared
    run: |
      sudo apt-get update
      sudo apt-get install -y curl

      curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
        -o cloudflared

      chmod +x cloudflared
      sudo mv cloudflared /usr/local/bin/

  - name: Start SSH + Cloudflare Tunnel
    run: |
      sudo apt-get install -y openssh-server

      sudo service ssh start

      cloudflared tunnel --url ssh://localhost:22 > tunnel.log 2>&1 &

      sleep 5

      TUNNEL_URL=$(grep -o 'https://.*trycloudflare.com' tunnel.log | head -n 1)

      echo "::add-mask::$TUNNEL_URL"
      echo "CF_URL=$TUNNEL_URL" >> $GITHUB_ENV

  - name: Send Terminal Link to Telegram
    env:
      TOKEN: ${{ secrets.TG_TOKEN }}
      CHATID: ${{ secrets.TG_CHATID }}
      CF_URL: ${{ env.CF_URL }}
    run: |
      MESSAGE="*OpenCode Ready (Cloudflare Tunnel)*

      • *URL:* \`$CF_URL\`"

      curl -sX POST \
        "https://api.telegram.org/bot${TOKEN}/sendMessage" \
        -d "chat_id=${CHATID}" \
        -d "parse_mode=Markdown" \
        -d "text=${MESSAGE}" \
        > /dev/null

  - name: Keep Session Alive
    run: |
      while true; do
        sleep 60
      done

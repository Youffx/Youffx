name: OpenCode

on:
  workflow_dispatch:
    inputs:
      kernel_target:
        description: "Target kernel to clone"
        required: true
        type: choice
        options:
          - "genesis-23.2 (4.19)"
          - "lineage-23.2 (4.19)"
          - "lineage-ns-23.2 (4.19)"
          - "gki-5.10 (legacy)"
          - "none (skip kernel clone)"
          - "miatoll"
        default: "lineage-23.2 (4.19)"
      clone_ksu:
        description: "Clone KernelSU variant"
        required: false
        type: choice
        options:
          - "none"
          - "kernelsu (main)"
          - "kernelsu-next (legacy-susfs)"
        default: "none"
      clone_infra:
        description: "Clone Infra-BWX app"
        required: false
        type: boolean
        default: false
      clone_dev:
        description: "Clone Youffx dev repo"
        required: false
        type: boolean
        default: false
      session_timeout:
        description: "Max session time in hours (0 = no limit)"
        required: false
        type: string
        default: "6"

jobs:
  code-session:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            opencode.json
          sparse-checkout-cone-mode: false

      - name: Clone kernel (genesis 23.2)
        if: github.event.inputs.kernel_target == 'genesis-23.2 (4.19)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=1 -b 23.2-genesis \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
            4.19

      - name: Clone kernel (miatoll)
        if: github.event.inputs.kernel_target == 'miatoll'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=1 \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_sm6250.git \
            kernel

      - name: Clone kernel (lineage 23.2)
        if: github.event.inputs.kernel_target == 'lineage-23.2 (4.19)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=1 -b 23.2-lineage \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
            4.19

      - name: Clone kernel (lineage NS 23.2)
        if: github.event.inputs.kernel_target == 'lineage-ns-23.2 (4.19)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=1 -b 23.2-lineage-ns \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
            4.19

      - name: Clone kernel (GKI 5.10)
        if: github.event.inputs.kernel_target == 'gki-5.10 (legacy)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=7 -b legacy \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/android_kernel_xiaomi_mt6785_5.10.git \
            5.10

      - name: Clone KernelSU
        if: github.event.inputs.clone_ksu == 'kernelsu (main)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone -b main \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/KernelSU.git \
            ksu

      - name: Clone KernelSU-Next
        if: github.event.inputs.clone_ksu == 'kernelsu-next (legacy-susfs)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone -b legacy-susfs \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/KernelSU-Next.git \
            ksu

      - name: Clone Infra-BWX
        if: github.event.inputs.clone_infra == 'true'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=1 \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/Infra-BWX.git \
            Infra-BWX

      - name: Clone Youffx dev
        if: github.event.inputs.clone_dev == 'true'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone -b master \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/Youffx.git \
            dev

      - name: Configure Git + Import GPG
        run: |
          git config --global user.name "${{ secrets.USER }}"
          git config --global user.email "${{ secrets.EMAIL }}"

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "default-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
          echo "max-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

          echo "${{ secrets.GPG_PRIVATE_KEY }}" > private.key
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --import private.key
          rm -f private.key

          gpgconf --kill gpg-agent

          echo "test" | gpg --clearsign \
            --batch \
            --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            > /dev/null

          git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global gpg.program gpg

      - name: Set Git Author Environment
        run: |
          echo "GIT_AUTHOR_NAME=${{ secrets.USER }}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_EMAIL=${{ secrets.EMAIL }}" >> $GITHUB_ENV
          echo "GIT_COMMITTER_NAME=${{ secrets.USER }}" >> $GITHUB_ENV
          echo "GIT_COMMITTER_EMAIL=${{ secrets.EMAIL }}" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache NPM
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-opencode-v1
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install OpenCode + tools
        run: |
          npm i -g opencode-ai
          npm i -g @dietrichgebert/ponytail
          npm i -g rtk
          sudo ln -sf "$(npm prefix -g)"/bin/* /usr/local/bin/
          opencode --version

      - name: Configure OpenCode
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "plugin": [
              "@dietrichgebert/ponytail"
            ]
          }
          EOF

      - name: Install SSH tunnel dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openssh-server \
            netcat-openbsd

      - name: Setup SSH keepalive config
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/config <<'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ExitOnForwardFailure yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

      - name: Start SSH server
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          sudo mkdir -p /var/run/sshd
          sudo sed -i 's/#Port 22/Port 22/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
          sudo sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo ssh-keygen -A
          echo "runner ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/runner

          SESSION_RC='cd "$HOME/work/Youffx/Youffx" 2>/dev/null'
          echo "$SESSION_RC" >> ~/.bashrc
          echo "$SESSION_RC" | sudo tee /etc/profile.d/zz-session.sh > /dev/null

          if [ -n "$SSH_PUBLIC_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_PUBLIC_KEY" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            chmod 700 ~/.ssh
            echo "Added SSH public key to authorized_keys"
          else
            echo "No SSH_PUBLIC_KEY secret found - password auth required"
          fi

          sudo service ssh start
          sleep 2
          sudo service ssh status

      - name: Start cloudflared tunnel
        run: |
          wget -q -O /tmp/cloudflared-linux-amd64.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared-linux-amd64.deb

          for i in {1..10}; do
            if nc -z localhost 22; then
              break
            fi
            sleep 1
          done

          nohup cloudflared tunnel --url ssh://localhost:22 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          CLOUDFLARED_PID=$!
          echo $CLOUDFLARED_PID > /tmp/cloudflared.pid

          for i in {1..120}; do
            if kill -0 $CLOUDFLARED_PID 2>/dev/null; then
              if grep -q 'https://.*\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null; then
                echo "Found trycloudflare.com URL at attempt $i"
                break
              fi
            else
              echo "cloudflared process died"
              break
            fi
            echo "Waiting for tunnel... ($i/120)"
            sleep 1
          done

          CF_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
          if [ -n "$CF_URL" ]; then
            CF_HOST=$(echo "$CF_URL" | sed 's|https://||')
            echo "::add-mask::$CF_URL"
            echo "CLOUDFLARED_URL=$CF_URL" >> "$GITHUB_ENV"
            echo "CLOUDFLARED_HOST=$CF_HOST" >> "$GITHUB_ENV"
            echo "cloudflared tunnel ready"
          else
            echo "cloudflared tunnel failed to start"
            echo "=== cloudflared log ==="
            cat /tmp/cloudflared.log
            echo "======================"
            echo "Process running: $(kill -0 $CLOUDFLARED_PID 2>/dev/null && echo yes || echo no)"
            exit 1
          fi

      - name: Send connection info to Telegram
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
        run: |
          MSG="*Session Ready*

          *Cloudflared:* $CLOUDFLARED_URL
          *SSH:* \`ssh -o ProxyCommand=\"cloudflared access ssh --hostname %h\" runner@$CLOUDFLARED_HOST\`"

          curl -sX POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHATID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MSG}" \
            > /dev/null 2>&1

      - name: Monitor session health
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
        run: |
          TIMEOUT_HOURS="${{ github.event.inputs.session_timeout }}"
          TIMEOUT_SECONDS=0
          if [ "$TIMEOUT_HOURS" != "0" ]; then
            TIMEOUT_SECONDS=$((TIMEOUT_HOURS * 3600))
          fi

          START_TIME=$(date +%s)
          CF_PID_FILE="/tmp/cloudflared.pid"
          MAX_RESTARTS=3
          RESTART_COUNT=0
          WARNING_SENT=false
          GRACE_SECONDS=60
          CF_DEAD_SINCE=0

          send_tg() {
            curl -sX POST \
              "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHATID}" \
              -d "parse_mode=Markdown" \
              -d "text=$1" \
              > /dev/null 2>&1
          }

          restart_cloudflared() {
            echo "Restarting cloudflared (attempt $((RESTART_COUNT+1))/$MAX_RESTARTS)..."

            if [ -f "$CF_PID_FILE" ]; then
              kill $(cat "$CF_PID_FILE") 2>/dev/null || true
              rm -f "$CF_PID_FILE"
            fi

            rm -f /tmp/cloudflared.log

            nohup cloudflared tunnel --url ssh://localhost:22 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
            CF_PID=$!
            echo $CF_PID > "$CF_PID_FILE"

            for i in {1..60}; do
              if kill -0 $CF_PID 2>/dev/null; then
                if grep -q 'https://.*\.trycloudflare\.com' /tmp/cloudflared.log 2>&1; then
                  CF_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
                  if [ -n "$CF_URL" ]; then
                    CF_HOST=$(echo "$CF_URL" | sed 's|https://||')
                    echo "::add-mask::$CF_URL"
                    echo "Cloudflared restarted. URL: $CF_URL"
                    send_tg "*Tunnel restarted*
                    *New URL:* $CF_URL
                    *SSH:* \`ssh -o ProxyCommand=\"cloudflared access ssh --hostname %h\" runner@$CF_HOST\`"
                    RESTART_COUNT=$((RESTART_COUNT + 1))
                    return 0
                  fi
                fi
              else
                echo "cloudflared died during restart attempt"
                break
              fi
              sleep 1
            done

            echo "Failed to restart cloudflared"
            return 1
          }

          echo "Session monitor started. Timeout: ${TIMEOUT_HOURS}h (${TIMEOUT_SECONDS}s)"

          while true; do
            sleep 15

            if [ -f /tmp/stop_session ]; then
              echo "Stop requested. Ending session."
              send_tg "*Session ended*
              Reason: Manual stop"
              break
            fi

            if [ "$TIMEOUT_SECONDS" -gt 0 ]; then
              ELAPSED=$(($(date +%s) - START_TIME))
              REMAINING=$((TIMEOUT_SECONDS - ELAPSED))

              if [ "$REMAINING" -le 0 ]; then
                echo "Session timeout reached (${TIMEOUT_HOURS}h). Exiting."
                send_tg "*Session ended*
                Reason: Timeout (${TIMEOUT_HOURS}h)"
                break
              fi

              if [ "$REMAINING" -le 1800 ] && [ "$WARNING_SENT" = false ]; then
                MINS=$((REMAINING / 60))
                send_tg "*Warning:* Session ends in ~${MINS} minutes."
                WARNING_SENT=true
              fi
            fi

            CF_OK=true
            if [ -f "$CF_PID_FILE" ]; then
              CF_PID=$(cat "$CF_PID_FILE")
              if ! kill -0 "$CF_PID" 2>/dev/null; then
                CF_OK=false
              fi
            else
              CF_OK=false
            fi

            if [ "$CF_OK" = false ]; then
              NOW=$(date +%s)

              if [ "$CF_DEAD_SINCE" -eq 0 ]; then
                CF_DEAD_SINCE=$NOW
                echo "Cloudflared detected dead. Grace period: ${GRACE_SECONDS}s"
                continue
              fi

              DEAD_FOR=$((NOW - CF_DEAD_SINCE))

              if [ "$DEAD_FOR" -lt "$GRACE_SECONDS" ]; then
                echo "Cloudflared dead for ${DEAD_FOR}s, grace: ${GRACE_SECONDS}s. Waiting..."
                continue
              fi

              if [ "$RESTART_COUNT" -lt "$MAX_RESTARTS" ]; then
                CF_DEAD_SINCE=0
                if restart_cloudflared; then
                  continue
                fi
              fi

              echo "Cloudflared permanently lost after $MAX_RESTARTS restart attempts. Exiting."
              send_tg "*Session ended*
              Reason: Tunnel lost (cloudflared crashed after ${MAX_RESTARTS} restart attempts)"
              break
            else
              CF_DEAD_SINCE=0
            fi
          done

          if [ -f "$CF_PID_FILE" ]; then
            kill $(cat "$CF_PID_FILE") 2>/dev/null || true
          fi

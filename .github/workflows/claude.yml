name: OpenCode

on:
  workflow_dispatch:
    inputs:
      kernel_target:
        description: "Kernel"
        required: true
        type: choice
        options:
          - "genesis-23.2 (4.19)"
          - "lineage-23.2 (4.19)"
          - "lineage-ns-23.2 (4.19)"
          - "custom (rosemary)"
          - "gki-5.10 (legacy)"
          - "none (skip)"
          - "miatoll"
        default: "none (skip)"
      kernel_branch:
        description: "Branch (custom only)"
        required: false
        type: string
        default: ""
      clone_ksu:
        description: "KernelSU"
        required: false
        type: choice
        options:
          - "none"
          - "kernelsu (main)"
          - "kernelsu-next (legacy-susfs)"
        default: "none"
      clone_infra:
        description: "Clone Infra-BWX"
        required: false
        type: boolean
        default: false
      clone_dev:
        description: "Clone dev repo"
        required: false
        type: boolean
        default: false
      session_timeout:
        description: "Timeout in hours (0 = no limit)"
        required: false
        type: string
        default: "6"
      ai_agent:
        description: "AI Coding Agent"
        required: true
        type: choice
        options:
          - "opencode"
          - "claude-code"
        default: "claude-code"
      ai_provider:
        description: "AI Provider (claude-code only)"
        required: true
        type: choice
        options:
          - "openrouter"
          - "nvidia-nim"
        default: "openrouter"

jobs:
  code-session:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            opencode.json
          sparse-checkout-cone-mode: false

      - name: Clone kernel (genesis 23.2)
        if: github.event.inputs.kernel_target == 'genesis-23.2 (4.19)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=1 -b 23.2-genesis \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
            4.19

      - name: Clone kernel (miatoll)
        if: github.event.inputs.kernel_target == 'miatoll'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=1 \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_sm6250.git \
            kernel

      - name: Clone kernel (lineage 23.2)
        if: github.event.inputs.kernel_target == 'lineage-23.2 (4.19)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=1 -b 23.2-lineage \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
            4.19

      - name: Clone kernel (lineage NS 23.2)
        if: github.event.inputs.kernel_target == 'lineage-ns-23.2 (4.19)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=1 -b 23.2-lineage-ns \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
            4.19

      - name: Clone kernel (custom branch)
        if: github.event.inputs.kernel_target == 'custom (rosemary)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch }}"
          if [ -z "$BRANCH" ]; then
            echo "Error: kernel_branch input is required when using custom target"
            exit 1
          fi
          git clone --depth=1 -b "$BRANCH" \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
            4.19

      - name: Clone kernel (GKI 5.10)
        if: github.event.inputs.kernel_target == 'gki-5.10 (legacy)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=7 -b legacy \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/android_kernel_xiaomi_mt6785_5.10.git \
            5.10

      - name: Clone KernelSU
        if: github.event.inputs.clone_ksu == 'kernelsu (main)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone -b main \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/KernelSU.git \
            ksu

      - name: Clone KernelSU-Next
        if: github.event.inputs.clone_ksu == 'kernelsu-next (legacy-susfs)'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone -b legacy-susfs \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/KernelSU-Next.git \
            ksu

      - name: Clone Infra-BWX
        if: github.event.inputs.clone_infra == 'true'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone --depth=1 \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/Infra-BWX.git \
            Infra-BWX

      - name: Clone Youffx dev
        if: github.event.inputs.clone_dev == 'true'
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          git clone -b master \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/Youffx.git \
            dev

      - name: Configure Git + Import GPG
        run: |
          git config --global user.name "${{ secrets.USER }}"
          git config --global user.email "${{ secrets.EMAIL }}"

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "default-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
          echo "max-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

          echo "${{ secrets.GPG_PRIVATE_KEY }}" > private.key
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --import private.key
          rm -f private.key

          gpgconf --kill gpg-agent

          echo "test" | gpg --clearsign \
            --batch \
            --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            > /dev/null

          git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global gpg.program gpg

      - name: Set Git Author Environment
        run: |
          echo "GIT_AUTHOR_NAME=${{ secrets.USER }}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_EMAIL=${{ secrets.EMAIL }}" >> $GITHUB_ENV
          echo "GIT_COMMITTER_NAME=${{ secrets.USER }}" >> $GITHUB_ENV
          echo "GIT_COMMITTER_EMAIL=${{ secrets.EMAIL }}" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache NPM
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-opencode-v1
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install OpenCode + tools
        if: github.event.inputs.ai_agent == 'opencode'
        run: |
          npm i -g opencode-ai
          npm i -g @dietrichgebert/ponytail
          npm i -g rtk
          sudo ln -sf "$(npm prefix -g)"/bin/* /usr/local/bin/
          opencode --version

      - name: Install Claude Code
        if: github.event.inputs.ai_agent == 'claude-code'
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo ln -sf "$(npm prefix -g)"/bin/* /usr/local/bin/
          claude --version

      - name: Install Remotion skills
        run: |
          npx -y skills@latest add remotion-dev/skills -g -y || true
          P1="open"; P2="code"
          DEST="$HOME/.config/${P1}${P2}/skills"
          mkdir -p "$DEST"
          cp -rn "$HOME/.agents/skills/remotion-"* "$DEST"/ 2>/dev/null || true
          ls "$DEST" | grep remotion || true

      - name: Install content support skills
        run: |
          npx -y skills@latest add vercel-labs/agent-skills -g -y -s web-design-guidelines -s writing-guidelines || true
          P1="open"; P2="code"
          DEST="$HOME/.config/${P1}${P2}/skills"
          mkdir -p "$DEST"
          cp -rn "$HOME/.agents/skills/web-design-guidelines" "$HOME/.agents/skills/writing-guidelines" "$DEST"/ 2>/dev/null || true
          ls "$DEST" | grep -E "web-design|writing-" || true

      - name: Install free media skills
        run: |
          npx -y skills@latest add karotkriss/remove-background -g -y -s remove-background || true
          npx -y skills@latest add wyattowalsh/agents -g -y -s ffmpeg || true
          npx -y skills@latest add crafter-station/trx -g -y || true
          P1="open"; P2="code"
          DEST="$HOME/.config/${P1}${P2}/skills"
          mkdir -p "$DEST"
          cp -rn "$HOME/.agents/skills/remove-background" "$HOME/.agents/skills/ffmpeg" "$HOME/.agents/skills/trx" "$DEST"/ 2>/dev/null || true
          ls "$DEST" | grep -E "remove-background|^ffmpeg$|^trx$" || true

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Configure OpenCode
        if: github.event.inputs.ai_agent == 'opencode'
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "plugin": [
              "@dietrichgebert/ponytail"
            ]
          }
          EOF

      - name: Configure Claude Code
        if: github.event.inputs.ai_agent == 'claude-code'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPEN_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AI_PROVIDER: ${{ github.event.inputs.ai_provider }}
        run: |
          mkdir -p ~/.claude
          rm -f ~/.claude/.credentials.json

          if [ "$AI_PROVIDER" = "nvidia-nim" ]; then
            BASE_URL="https://integrate.api.nvidia.com/v1"
            AUTH_TOKEN="${NVIDIA_API_KEY}"
            MODEL="nvidia/nemotron-3-ultra-550b-a55b:free"
          else
            BASE_URL="https://openrouter.ai/api"
            AUTH_TOKEN="${OPENROUTER_API_KEY}"
            MODEL="openrouter/free"
          fi

          printf '%s\n' \
            '{' \
            '  "env": {' \
            "    \"ANTHROPIC_BASE_URL\": \"${BASE_URL}\"," \
            "    \"ANTHROPIC_AUTH_TOKEN\": \"${AUTH_TOKEN}\"," \
            '    "ANTHROPIC_API_KEY": "",' \
            "    \"ANTHROPIC_DEFAULT_HAIKU_MODEL\": \"${MODEL}\"," \
            "    \"ANTHROPIC_DEFAULT_SONNET_MODEL\": \"${MODEL}\"," \
            "    \"ANTHROPIC_DEFAULT_OPUS_MODEL\": \"${MODEL}\"," \
            "    \"ANTHROPIC_DEFAULT_FABLE_MODEL\": \"${MODEL}\"" \
            '  }' \
            '}' > ~/.claude/settings.local.json

          sudo printf '%s\n' \
            "export ANTHROPIC_BASE_URL=\"${BASE_URL}\"" \
            "export ANTHROPIC_AUTH_TOKEN=\"${AUTH_TOKEN}\"" \
            'export ANTHROPIC_API_KEY=""' \
            "export ANTHROPIC_DEFAULT_HAIKU_MODEL=\"${MODEL}\"" \
            "export ANTHROPIC_DEFAULT_SONNET_MODEL=\"${MODEL}\"" \
            "export ANTHROPIC_DEFAULT_OPUS_MODEL=\"${MODEL}\"" \
            "export ANTHROPIC_DEFAULT_FABLE_MODEL=\"${MODEL}\"" \
            | sudo tee /etc/profile.d/claude-code.sh > /dev/null

      - name: Install SSH tunnel dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openssh-server \
            netcat-openbsd

      - name: Setup SSH keepalive config
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/config <<'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ExitOnForwardFailure yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

      - name: Start SSH server
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPEN_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AI_AGENT: ${{ github.event.inputs.ai_agent }}
          AI_PROVIDER: ${{ github.event.inputs.ai_provider }}
        run: |
          sudo mkdir -p /var/run/sshd
          sudo sed -i 's/#Port 22/Port 22/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
          sudo sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo ssh-keygen -A
          echo "runner ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/runner

          SESSION_RC='cd "$HOME/work/Youffx/Youffx" 2>/dev/null'
          echo "$SESSION_RC" >> ~/.bashrc
          echo "$SESSION_RC" | sudo tee /etc/profile.d/zz-session.sh > /dev/null

          if [ "$AI_AGENT" = "claude-code" ]; then
            if [ "$AI_PROVIDER" = "nvidia-nim" ]; then
              BASE_URL="https://integrate.api.nvidia.com/v1"
              AUTH_TOKEN="${NVIDIA_API_KEY}"
              MODEL="nvidia/nemotron-3-ultra-550b-a55b:free"
            else
              BASE_URL="https://openrouter.ai/api"
              AUTH_TOKEN="${OPENROUTER_API_KEY}"
              MODEL="openrouter/free"
            fi
            echo "export ANTHROPIC_BASE_URL=\"${BASE_URL}\"" >> ~/.bashrc
            echo "export ANTHROPIC_AUTH_TOKEN=\"${AUTH_TOKEN}\"" >> ~/.bashrc
            echo 'export ANTHROPIC_API_KEY=""' >> ~/.bashrc
            echo "export ANTHROPIC_DEFAULT_HAIKU_MODEL=\"${MODEL}\"" >> ~/.bashrc
            echo "export ANTHROPIC_DEFAULT_SONNET_MODEL=\"${MODEL}\"" >> ~/.bashrc
            echo "export ANTHROPIC_DEFAULT_OPUS_MODEL=\"${MODEL}\"" >> ~/.bashrc
            echo "export ANTHROPIC_DEFAULT_FABLE_MODEL=\"${MODEL}\"" >> ~/.bashrc
          fi

          if [ -n "$SSH_PUBLIC_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_PUBLIC_KEY" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            chmod 700 ~/.ssh
            echo "Added SSH public key to authorized_keys"
          else
            echo "No SSH_PUBLIC_KEY secret found - password auth required"
          fi

          sudo service ssh start
          sleep 2
          sudo service ssh status

      - name: Start cloudflared tunnel
        run: |
          wget -q -O /tmp/cloudflared-linux-amd64.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared-linux-amd64.deb

          for i in {1..10}; do
            if nc -z localhost 22; then
              break
            fi
            sleep 1
          done

          nohup cloudflared tunnel --url ssh://localhost:22 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          CLOUDFLARED_PID=$!
          echo $CLOUDFLARED_PID > /tmp/cloudflared.pid

          for i in {1..120}; do
            if kill -0 $CLOUDFLARED_PID 2>/dev/null; then
              if grep -q 'https://.*\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null; then
                echo "Found trycloudflare.com URL at attempt $i"
                break
              fi
            else
              echo "cloudflared process died"
              break
            fi
            echo "Waiting for tunnel... ($i/120)"
            sleep 1
          done

          CF_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
          if [ -n "$CF_URL" ]; then
            CF_HOST=$(echo "$CF_URL" | sed 's|https://||')
            echo "::add-mask::$CF_URL"
            echo "::add-mask::$CF_HOST"
            echo "CLOUDFLARED_URL=$CF_URL" >> "$GITHUB_ENV"
            echo "CLOUDFLARED_HOST=$CF_HOST" >> "$GITHUB_ENV"
            echo "cloudflared tunnel ready (URL hidden, sent to Telegram only)"
          else
            echo "cloudflared tunnel failed to start"
            echo "=== cloudflared log (URLs masked) ==="
            grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -5 | while read -r u; do echo "::add-mask::$u"; done || true
            cat /tmp/cloudflared.log
            echo "======================"
            echo "Process running: $(kill -0 $CLOUDFLARED_PID 2>/dev/null && echo yes || echo no)"
            exit 1
          fi

      - name: Install web terminal (ttyd)
        run: |
          # Lightweight web terminal, runs as current non-root user (runner).
          # Verified on Ubuntu 24.04 (noble): apt provides ttyd 1.7.4, no Node/Docker needed.
          # Wetty is intentionally NOT used (needs Node + npm, heavier).
          sudo apt-get update -qq
          sudo apt-get install -y -qq ttyd
          ttyd --version
          echo "ttyd installed. Running user: $(whoami) (uid $(id -u))"

      - name: Start secure web terminal + web tunnel
        run: |
          set -euo pipefail
          # ---- 1. Generate strong random credential (never echo it) ----
          WEB_USER="runner"
          # 32 alphanum chars from openssl, no symbols to keep Basic-Auth URL-safe
          WEB_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)
          if [ ${#WEB_PASS} -lt 24 ]; then
            echo "Password generation failed" >&2
            exit 1
          fi
          echo "::add-mask::$WEB_PASS"
          printf '%s:%s' "$WEB_USER" "$WEB_PASS" > "$HOME/.ttyd-web-auth"
          chmod 600 "$HOME/.ttyd-web-auth"
          {
            echo "TTYD_USER=$WEB_USER"
            echo "TTYD_PASS=$WEB_PASS"
          } >> "$GITHUB_ENV"
          echo "Credential saved to ~/.ttyd-web-auth (600). Retrieve over SSH with: cat ~/.ttyd-web-auth"

          # ---- 2. Start ttyd bound to localhost only, as current user ----
          WORKDIR="$HOME/work/Youffx/Youffx"
          [ -d "$WORKDIR" ] || WORKDIR="$HOME"
          # -i 127.0.0.1: never expose directly. -W: allow input (else read-only).
          # Do NOT pass -O (origin check) so Cloudflare hostname can proxy websockets.
          # Run login bash so PATH, nvm, sdk, git config match normal SSH session.
          pkill -f "ttyd.*127.0.0.1:7681" 2>/dev/null || true
          nohup /usr/bin/ttyd -i 127.0.0.1 -p 7681 -W -c "$WEB_USER:$WEB_PASS" \
            -t titleFixed='Youffx runner web terminal' \
            -w "$WORKDIR" /bin/bash -l > /tmp/ttyd.log 2>&1 &
          echo $! > /tmp/ttyd.pid
          sleep 2
          if ! kill -0 "$(cat /tmp/ttyd.pid)" 2>/dev/null; then
            echo "ttyd failed to start. Log:"
            cat /tmp/ttyd.log
            exit 1
          fi

          # ---- 3. Verify localhost-only listener + local HTTP ----
          echo "=== listeners ==="
          ss -tlnp | grep 7681 || (echo "ttyd not listening" && cat /tmp/ttyd.log && exit 1)
          if ss -tln | grep -q '0.0.0.0:7681\|:::7681'; then
            echo "ERROR: ttyd bound to public interface, refusing" >&2
            exit 1
          fi
          # -u with credential from file (password never appears in ps of this echo)
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -u "$WEB_USER:$WEB_PASS" http://127.0.0.1:7681/ || true)
          echo "Local HTTP code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Local ttyd HTTP check failed"
            cat /tmp/ttyd.log
            exit 1
          fi
          echo "ttyd verified on 127.0.0.1:7681 only"

          # ---- 4. Separate Quick Tunnel for HTTP (do NOT touch SSH tunnel) ----
          # Existing tunnel is: cloudflared tunnel --url ssh://localhost:22 (SSH-only,
          # hostname clinical-runner-*.trycloudflare.com cannot serve HTTP).
          # Restarting/reusing it would kill SSH, so start a SECOND tunnel.
          # Quick Tunnel limitation: random trycloudflare.com URL, dies with workflow.
          rm -f /tmp/cloudflared-web.log /tmp/cloudflared-web.pid
          nohup cloudflared tunnel --url http://localhost:7681 --no-autoupdate > /tmp/cloudflared-web.log 2>&1 &
          WEB_PID=$!
          echo $WEB_PID > /tmp/cloudflared-web.pid
          for i in $(seq 1 120); do
            if kill -0 $WEB_PID 2>/dev/null; then
              if grep -q 'https://.*\.trycloudflare\.com' /tmp/cloudflared-web.log 2>/dev/null; then
                echo "Web tunnel URL found at attempt $i"
                break
              fi
            else
              echo "cloudflared-web died"
              grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared-web.log 2>/dev/null | head -5 | while read -r u; do echo "::add-mask::$u"; done || true
              cat /tmp/cloudflared-web.log
              exit 1
            fi
            sleep 1
          done
          WEB_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared-web.log | head -1)
          if [ -z "$WEB_URL" ]; then
            echo "Web tunnel failed to start"
            grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared-web.log 2>/dev/null | head -5 | while read -r u; do echo "::add-mask::$u"; done || true
            cat /tmp/cloudflared-web.log
            exit 1
          fi
          WEB_HOST=$(echo "$WEB_URL" | sed 's|https://||')
          echo "::add-mask::$WEB_URL"
          echo "::add-mask::$WEB_HOST"
          {
            echo "WEB_URL=$WEB_URL"
            echo "WEB_HOST=$WEB_HOST"
          } >> "$GITHUB_ENV"
          echo "$WEB_URL" > /tmp/web-url.txt
          echo "Web tunnel ready (URLs hidden, SSH tunnel untouched, details via Telegram only)"

      - name: Send connection info to Telegram
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
        run: |
          # Mask semua connect link + password agar tidak muncul di public workflow logs.
          # Link hanya dikirim via Telegram DM (CHATID). Jangan echo variabel ini.
          echo "::add-mask::$CLOUDFLARED_URL"
          echo "::add-mask::$CLOUDFLARED_HOST"
          echo "::add-mask::$WEB_URL"
          echo "::add-mask::$WEB_HOST"
          echo "::add-mask::$TTYD_PASS"
          MSG="*Session Ready*

          *Cloudflared:* $CLOUDFLARED_URL
          *SSH:* \`ssh -o ProxyCommand=\"cloudflared access ssh --hostname %h\" runner@$CLOUDFLARED_HOST\`

          *Web terminal (Windows Chrome/Edge):* $WEB_URL
          *Web user:* \`$TTYD_USER\`
          *Web pass:* \`$TTYD_PASS\`
          Buka URL di atas, login Basic-Auth dengan user/pass itu. Jangan share link ini."

          curl -sX POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHATID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MSG}" \
            > /dev/null 2>&1

      - name: Monitor session health
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
        run: |
          TIMEOUT_HOURS="${{ github.event.inputs.session_timeout }}"
          TIMEOUT_SECONDS=0
          if [ "$TIMEOUT_HOURS" != "0" ]; then
            TIMEOUT_SECONDS=$((TIMEOUT_HOURS * 3600))
          fi

          START_TIME=$(date +%s)
          CF_PID_FILE="/tmp/cloudflared.pid"
          WEB_PID_FILE="/tmp/cloudflared-web.pid"
          TTYD_PID_FILE="/tmp/ttyd.pid"
          MAX_RESTARTS=3
          RESTART_COUNT=0
          WEB_RESTART_COUNT=0
          WARNING_SENT=false
          GRACE_SECONDS=60
          CF_DEAD_SINCE=0
          WEB_DEAD_SINCE=0

          send_tg() {
            curl -sX POST \
              "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHATID}" \
              -d "parse_mode=Markdown" \
              -d "text=$1" \
              > /dev/null 2>&1
          }

          restart_cloudflared() {
            echo "Restarting cloudflared (attempt $((RESTART_COUNT+1))/$MAX_RESTARTS)..."

            if [ -f "$CF_PID_FILE" ]; then
              kill $(cat "$CF_PID_FILE") 2>/dev/null || true
              rm -f "$CF_PID_FILE"
            fi

            rm -f /tmp/cloudflared.log

            nohup cloudflared tunnel --url ssh://localhost:22 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
            CF_PID=$!
            echo $CF_PID > "$CF_PID_FILE"

            for i in {1..60}; do
              if kill -0 $CF_PID 2>/dev/null; then
                if grep -q 'https://.*\.trycloudflare\.com' /tmp/cloudflared.log 2>&1; then
                  CF_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
                  if [ -n "$CF_URL" ]; then
                    CF_HOST=$(echo "$CF_URL" | sed 's|https://||')
                    echo "::add-mask::$CF_URL"
                    echo "::add-mask::$CF_HOST"
                    echo "Cloudflared restarted (new URL hidden, sent to Telegram)."
                    send_tg "*Tunnel restarted*
                    *New URL:* $CF_URL
                    *SSH:* \`ssh -o ProxyCommand=\"cloudflared access ssh --hostname %h\" runner@$CF_HOST\`"
                    RESTART_COUNT=$((RESTART_COUNT + 1))
                    return 0
                  fi
                fi
              else
                echo "cloudflared died during restart attempt"
                break
              fi
              sleep 1
            done

            echo "Failed to restart cloudflared"
            return 1
          }

          restart_web_tunnel() {
            echo "Restarting cloudflared-web (attempt $((WEB_RESTART_COUNT+1))/$MAX_RESTARTS)..."
            if [ -f "$WEB_PID_FILE" ]; then
              kill $(cat "$WEB_PID_FILE") 2>/dev/null || true
              rm -f "$WEB_PID_FILE"
            fi
            rm -f /tmp/cloudflared-web.log
            nohup cloudflared tunnel --url http://localhost:7681 --no-autoupdate > /tmp/cloudflared-web.log 2>&1 &
            WEB_PID=$!
            echo $WEB_PID > "$WEB_PID_FILE"
            for i in {1..60}; do
              if kill -0 $WEB_PID 2>/dev/null; then
                if grep -q 'https://.*\.trycloudflare\.com' /tmp/cloudflared-web.log 2>&1; then
                  WEB_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared-web.log | head -1)
                  if [ -n "$WEB_URL" ]; then
                    WEB_HOST=$(echo "$WEB_URL" | sed 's|https://||')
                    echo "::add-mask::$WEB_URL"
                    echo "::add-mask::$WEB_HOST"
                    echo "$WEB_URL" > /tmp/web-url.txt
                    echo "Web tunnel restarted (new URL hidden, sent to Telegram)."
                    send_tg "*Web tunnel restarted*
                    *New web URL:* $WEB_URL"
                    WEB_RESTART_COUNT=$((WEB_RESTART_COUNT + 1))
                    return 0
                  fi
                fi
              else
                echo "cloudflared-web died during restart"
                break
              fi
              sleep 1
            done
            echo "Failed to restart web tunnel"
            return 1
          }

          restart_ttyd() {
            echo "Restarting ttyd..."
            CRED_FILE="$HOME/.ttyd-web-auth"
            if [ ! -f "$CRED_FILE" ]; then
              echo "ttyd credential file missing, cannot restart"
              return 1
            fi
            CRED=$(cat "$CRED_FILE")
            WORKDIR="$HOME/work/Youffx/Youffx"
            [ -d "$WORKDIR" ] || WORKDIR="$HOME"
            nohup /usr/bin/ttyd -i 127.0.0.1 -p 7681 -W -c "$CRED" \
              -t titleFixed='Youffx runner web terminal' \
              -w "$WORKDIR" /bin/bash -l > /tmp/ttyd.log 2>&1 &
            echo $! > "$TTYD_PID_FILE"
            sleep 2
            kill -0 "$(cat "$TTYD_PID_FILE")" 2>/dev/null
          }

          echo "Session monitor started. Timeout: ${TIMEOUT_HOURS}h (${TIMEOUT_SECONDS}s)"

          while true; do
            sleep 15

            if [ -f /tmp/stop_session ]; then
              echo "Stop requested. Ending session."
              send_tg "*Session ended*
              Reason: Manual stop"
              break
            fi

            if [ "$TIMEOUT_SECONDS" -gt 0 ]; then
              ELAPSED=$(($(date +%s) - START_TIME))
              REMAINING=$((TIMEOUT_SECONDS - ELAPSED))

              if [ "$REMAINING" -le 0 ]; then
                echo "Session timeout reached (${TIMEOUT_HOURS}h). Exiting."
                send_tg "*Session ended*
                Reason: Timeout (${TIMEOUT_HOURS}h)"
                break
              fi

              if [ "$REMAINING" -le 1800 ] && [ "$WARNING_SENT" = false ]; then
                MINS=$((REMAINING / 60))
                send_tg "*Warning:* Session ends in ~${MINS} minutes."
                WARNING_SENT=true
              fi
            fi

            CF_OK=true
            if [ -f "$CF_PID_FILE" ]; then
              CF_PID=$(cat "$CF_PID_FILE")
              if ! kill -0 "$CF_PID" 2>/dev/null; then
                CF_OK=false
              fi
            else
              CF_OK=false
            fi

            if [ "$CF_OK" = false ]; then
              NOW=$(date +%s)

              if [ "$CF_DEAD_SINCE" -eq 0 ]; then
                CF_DEAD_SINCE=$NOW
                echo "Cloudflared detected dead. Grace period: ${GRACE_SECONDS}s"
                continue
              fi

              DEAD_FOR=$((NOW - CF_DEAD_SINCE))

              if [ "$DEAD_FOR" -lt "$GRACE_SECONDS" ]; then
                echo "Cloudflared dead for ${DEAD_FOR}s, grace: ${GRACE_SECONDS}s. Waiting..."
                continue
              fi

              if [ "$RESTART_COUNT" -lt "$MAX_RESTARTS" ]; then
                CF_DEAD_SINCE=0
                if restart_cloudflared; then
                  continue
                fi
              fi

              echo "Cloudflared permanently lost after $MAX_RESTARTS restart attempts. Exiting."
              send_tg "*Session ended*
              Reason: Tunnel lost (cloudflared crashed after ${MAX_RESTARTS} restart attempts)"
              break
            else
              CF_DEAD_SINCE=0
            fi

            # ---- Web terminal health (ttyd must stay on 127.0.0.1:7681) ----
            if [ -f "$TTYD_PID_FILE" ]; then
              if ! kill -0 "$(cat "$TTYD_PID_FILE")" 2>/dev/null; then
                echo "ttyd dead, restarting..."
                if ! restart_ttyd; then
                  echo "ttyd restart failed"
                fi
              fi
            else
              echo "ttyd pid file missing, restarting..."
              restart_ttyd || true
            fi

            # ---- Web tunnel health (separate from SSH tunnel) ----
            WEB_OK=true
            if [ -f "$WEB_PID_FILE" ]; then
              if ! kill -0 "$(cat "$WEB_PID_FILE")" 2>/dev/null; then
                WEB_OK=false
              fi
            else
              WEB_OK=false
            fi
            if [ "$WEB_OK" = false ]; then
              NOW=$(date +%s)
              if [ "$WEB_DEAD_SINCE" -eq 0 ]; then
                WEB_DEAD_SINCE=$NOW
                echo "Web tunnel dead. Grace period: ${GRACE_SECONDS}s"
              else
                DEAD_FOR=$((NOW - WEB_DEAD_SINCE))
                if [ "$DEAD_FOR" -ge "$GRACE_SECONDS" ]; then
                  if [ "$WEB_RESTART_COUNT" -lt "$MAX_RESTARTS" ]; then
                    WEB_DEAD_SINCE=0
                    restart_web_tunnel || true
                  else
                    echo "Web tunnel permanently lost (SSH tunnel still alive)."
                    send_tg "*Web terminal offline.* SSH masih jalan. Restart workflow untuk web baru."
                    WEB_DEAD_SINCE=0
                    WEB_RESTART_COUNT=0
                  fi
                fi
              fi
            else
              WEB_DEAD_SINCE=0
            fi
          done

          if [ -f "$CF_PID_FILE" ]; then
            kill $(cat "$CF_PID_FILE") 2>/dev/null || true
          fi
          if [ -f "$WEB_PID_FILE" ]; then
            kill $(cat "$WEB_PID_FILE") 2>/dev/null || true
          fi
          if [ -f "$TTYD_PID_FILE" ]; then
            kill $(cat "$TTYD_PID_FILE") 2>/dev/null || true
          fi

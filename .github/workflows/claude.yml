name: OpenCode

on:
 workflow_dispatch:

jobs:
 code-session:
  runs-on: ubuntu-latest
    
  steps:
  - name: Clone Target Kernel Repository
    env:
      PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
    run: |
      rm -rf ./*
      git clone --depth=1 -b master \
        https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
        kernel_xiaomi_rosemary_4.19base
      git clone --depth=1 -b lineage-21 \
        https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
        kernel_xiaomi_rosemary_5.10base

  - name: Configure Git + Import GPG
    run: |
      git config --global user.name "${{ secrets.USER }}"
      git config --global user.email "${{ secrets.EMAIL }}"

      mkdir -p ~/.gnupg
      chmod 700 ~/.gnupg

      echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
      echo "default-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
      echo "max-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
      echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

      echo "${{ secrets.GPG_PRIVATE_KEY }}" > private.key
      gpg --batch --yes --pinentry-mode loopback \
        --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
        --import private.key
      rm -f private.key

      gpgconf --kill gpg-agent
      gpg-connect-agent reloadagent /bye

      echo "test" | gpg --clearsign \
        --batch \
        --pinentry-mode loopback \
        --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
        > /dev/null

      git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"
      git config --global commit.gpgsign true
      git config --global tag.gpgsign true
      git config --global gpg.program gpg

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Cache NPM
    uses: actions/cache@v4
    with:
      path: ~/.npm
      key: ${{ runner.os }}-npm-opencode-v1
      restore-keys: |
        ${{ runner.os }}-npm-

  - name: Install OpenCode + Ponytail
    run: |
      npm i -g opencode-ai
      npm i -g @dietrichgebert/ponytail
      npm i -g rtk

  - name: Configure OpenCode
    working-directory: ${{ github.workspace }}
    run: |
      cat > opencode.json <<'EOF'
      {
        "$schema": "https://opencode.ai/config.json",
        "plugin": [
          "@dietrichgebert/ponytail"
        ]
      }
      EOF
  
  - name: Setup Ngrok SSH
    env:
      NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    run: |
      sudo apt-get update
      sudo apt-get install -y openssh-server jq
      sudo mkdir -p /var/run/sshd
      echo "runner:${SSH_PASSWORD}" | sudo chpasswd
      sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
      sudo service ssh restart

      curl -sL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz
      sudo mv ngrok /usr/local/bin
      
      ngrok config add-authtoken $NGROK_TOKEN
      ngrok tcp 22 --log=stdout > ngrok.log &
      sleep 10
      
      SSH_URL=$(curl -s localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url' | sed 's/tcp:\/\///')
      
      echo "::add-mask::$SSH_URL"
      echo "SSH_URL=$SSH_URL" >> $GITHUB_ENV

  - name: Send Terminal Link to Telegram
    env:
      TOKEN: ${{ secrets.TG_TOKEN }}
      CHATID: ${{ secrets.TG_CHATID }}
      SSH_URL: ${{ env.SSH_URL }}
    run: |
      set +x
      
      MESSAGE="OpenCode Ready! Akses SSH menggunakan: ssh runner@${SSH_URL}"
      
      curl -sX POST \
        "https://api.telegram.org/bot${TOKEN}/sendMessage" \
        -d "chat_id=${CHATID}" \
        -d "text=${MESSAGE}" \
        > /dev/null 2>&1

  - name: Keep Session Alive Until Exit
    run: |
      while true
      do
        echo "Ngrok SSH session active"
        sleep 120
      done
      

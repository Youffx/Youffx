name: Claude Code

on:
  workflow_dispatch:

jobs:
  claude-session:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Target Kernel Repository
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          rm -rf ./*
          git clone \
            --depth 1 \
            -b master-s \
            https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential python3 python3-pip

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Configure Claude for Freemodel
        env:
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
        run: |
          mkdir -p ~/bin
          
          for dir in ".config/@anthropic-ai/claude-code" ".config/claude-code" ".cache/@anthropic-ai/claude-code" ".cache/claude-code" ".config/configstore"
          do
            mkdir -p ~/$dir
            cat > ~/$dir/config.json <<EOF
          {
            "token": "${CLAUDE_KEY}",
            "accountType": "console",
            "acceptedTerms": true
          }
          EOF
          done

          cat > ~/.config/configstore/@anthropic-ai-claude-code.json <<EOF
          {
            "token": "${CLAUDE_KEY}",
            "accountType": "console",
            "acceptedTerms": true
          }
          EOF

          cat > ~/.config/configstore/claude-code.json <<EOF
          {
            "token": "${CLAUDE_KEY}",
            "accountType": "console",
            "acceptedTerms": true
          }
          EOF

          GLOBAL_CLAUDE=$(type -p claude)
          cat > ~/bin/claude <<EOF
          export ANTHROPIC_BASE_URL=https://cc.freemodel.dev
          export ANTHROPIC_API_KEY=${CLAUDE_KEY}
          export CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=0
          export CLAUDE_CODE_AUTO_COMPACT_WINDOW=190000
          exec $GLOBAL_CLAUDE "\$@"
          EOF
          
          chmod +x ~/bin/claude
          echo 'export PATH="$HOME/bin:$PATH"' >> ~/.bashrc
          echo 'export PATH="$HOME/bin:$PATH"' >> ~/.profile

      - name: Verify Claude
        run: |
          export PATH="$HOME/bin:$PATH"
          timeout 20s claude -p "reply OK" || true

      - name: Setup Tmate Manually
        run: |
          sudo apt-get update && sudo apt-get install -y tmate
          mkdir -p ~/.ssh
          if [ ! -f ~/.ssh/id_rsa ]; then
            ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          fi
          tmate -S /tmp/tmate.sock new-session -d
          until tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' | grep -q "ssh "; do
            sleep 2
          done
          SSH_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          echo "::add-mask::$SSH_URL"
          echo "TMATE_SSH=$SSH_URL" >> $GITHUB_ENV

      - name: Send Terminal Link to Telegram
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
          SSH_URL: ${{ env.TMATE_SSH }}
        run: |
          set +x
          MESSAGE="*Claude Code Ready*
          
          • *SSH:* \`$SSH_URL\` "
          curl -sX POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHATID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}" \
            > /dev/null 2>&1

      - name: Keep Session Alive
        run: |
          while true
          do
            sleep 60
          done
          

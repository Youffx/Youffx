name: Claude Code

on:
  workflow_dispatch:

jobs:
  claude-session:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Target Kernel Repository
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          rm -rf ./*
          git clone --depth 1 -b master-s https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Configure Settings
        env:
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json <<EOF
          {
            "env": {
              "ANTHROPIC_API_KEY": "$CLAUDE_KEY",
              "ANTHROPIC_BASE_URL": "https://cc.freemodel.dev",
              "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"
            },
            "permissions": {
              "allow": [],
              "deny": []
            },
            "apiKeyHelper": "echo '$CLAUDE_KEY'"
          }
          EOF

      - name: Setup Tmate Manually
        run: |
          sudo apt-get update && sudo apt-get install -y tmate
          mkdir -p ~/.ssh
          if [ ! -f ~/.ssh/id_rsa ]; then
            ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          fi
          tmate -S /tmp/tmate.sock new-session -d
          TMATE_FMT=\$(printf '\x23{tmate_ssh}')
          until tmate -S /tmp/tmate.sock display -p "\$TMATE_FMT" | grep -q "ssh "; do
            sleep 2
          done
          SSH_URL=\$(tmate -S /tmp/tmate.sock display -p "\$TMATE_FMT")
          echo "::add-mask::\$SSH_URL"
          echo "TMATE_SSH=\$SSH_URL" >> \$GITHUB_ENV

      - name: Send Terminal Link to Telegram
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
          SSH_URL: ${{ env.TMATE_SSH }}
        run: |
          set +x
          MESSAGE="*Claude Code Ready*
          
          • *SSH:* \`$SSH_URL\` "
          curl -sX POST "https://api.telegram.org/bot\${TOKEN}/sendMessage" -d "chat_id=\${CHATID}" -d "parse_mode=Markdown" -d "text=\${MESSAGE}" > /dev/null 2>&1

      - name: Keep Session Alive
        run: |
          while true
          do
            sleep 60
          done
          

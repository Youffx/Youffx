name: Claude Code

on:
  workflow_dispatch:

jobs:
  claude-session:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Target Kernel Repository
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          rm -rf * .git
          git clone --depth 1 -b master-s https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Setup Free Claude Code Proxy Backend
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          git clone --depth 1 https://github.com/Alishahryar1/free-claude-code.git ~/.local/share/claude-free
          cd ~/.local/share/claude-free
          $HOME/.local/bin/uv sync
          $HOME/.local/bin/uv run uvicorn server:app --host 127.0.0.1 --port 8082 > proxy.log 2>&1 &
          sleep 3

      - name: Pre-configure Claude Code
        run: |
          mkdir -p ~/.config/claude
          echo '{"apiKey": "fe_oa_ecf0198216093c023ae1ed4f65abcdaae2d0494052956eb5", "baseUrl": "http://127.0.0.1:8082"}' > ~/.config/claude/config.json
          echo 'export ANTHROPIC_BASE_URL="http://127.0.0.1:8082"' >> ~/.bashrc
          echo 'export ANTHROPIC_API_KEY="fe_oa_ecf0198216093c023ae1ed4f65abcdaae2d0494052956eb5"' >> ~/.bashrc

      - name: Setup Tmate Background Server
        id: tmate-setup
        run: |
          sudo apt-get update && sudo apt-get install tmate -y
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          SSH_CONN=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          echo "::add-mask::$SSH_CONN"
          echo "ssh_conn=$SSH_CONN" >> $GITHUB_OUTPUT

      - name: Send Terminal Link to Telegram
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
          SSH_URL: ${{ steps.tmate-setup.outputs.ssh_conn }}
        run: |
          set +x
          MESSAGE="*Claude Code Ready*
          
          • *SSH:* \`$SSH_URL\`
          
          *Cara pakai:* 
          1. SSH ke link di atas.
          2. Tekan 'q'.
          3. Ketik 'claude'."

          curl -sX POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHATID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}" > /dev/null 2>&1

      - name: Keep Session Alive Safely
        run: |
          while [ -S /tmp/tmate.sock ]; do
            sleep 5
          done

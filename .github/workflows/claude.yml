name: Claude Code

on:
  workflow_dispatch:

jobs:
  claude-session:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Target Kernel Repository
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          rm -rf ./*
          git clone --depth 1 -b master-s https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code and Dependencies
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g rtk

      - name: Configure Freemodel Advanced Settings
        run: |
          mkdir -p ~/.claude/hooks
          
          cat > ~/.claude/settings.json <<EOF
          {
            "apiKeyHelper": "echo ''",
            "env": {
              "ANTHROPIC_BASE_URL": "https://cc.freemodel.dev",
              "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"
            },
            "permissions": {
              "allow": [],
              "deny": []
            },
            "model": "sonnet",
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": "Bash",
                  "hooks": [
                    {
                      "type": "command",
                      "command": "rtk hook claude"
                    }
                  ]
                }
              ],
              "SessionStart": [
                {
                  "hooks": [
                    {
                      "type": "command",
                      "command": "\"~/.claude/hooks/context-mode-cache-heal.mjs\""
                    }
                  ]
                }
              ]
            },
            "enabledPlugins": {
              "caveman@caveman": false,
              "context-mode@context-mode": true,
              "andrej-karpathy-skills@karpathy-skills": true,
              "obsidian@obsidian-skills": true
            },
            "extraKnownMarketplaces": {
              "caveman": {
                "source": {
                  "source": "github",
                  "repo": "JuliusBrussee/caveman"
                }
              },
              "karpathy-skills": {
                "source": {
                  "source": "github",
                  "repo": "forrestchang/andrej-karpathy-skills"
                }
              },
              "obsidian-skills": {
                "source": {
                  "source": "git",
                  "url": "https://github.com/kepano/obsidian-skills.git"
                }
              },
              "context-mode": {
                "source": {
                  "source": "github",
                  "repo": "mksglu/context-mode"
                }
              }
            },
            "effortLevel": "low",
            "theme": "auto"
          }
          EOF

          curl -fsSL "https://raw.githubusercontent.com/mksglu/context-mode/main/context-mode-cache-heal.mjs" -o ~/.claude/hooks/context-mode-cache-heal.mjs || true
          
          if [ ! -f ~/.claude/hooks/context-mode-cache-heal.mjs ]; then
            cat > ~/.claude/hooks/context-mode-cache-heal.mjs <<'INNER_EOF'
          console.log('Cache healer bypass active');
          INNER_EOF
          fi
          
          chmod +x ~/.claude/hooks/context-mode-cache-heal.mjs

      - name: Setup Tmate Manually
        run: |
          sudo apt-get update && sudo apt-get install -y tmate
          mkdir -p ~/.ssh
          if [ ! -f ~/.ssh/id_rsa ]; then
            ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          fi
          tmate -S /tmp/tmate.sock new-session -d
          until tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' | grep -q "ssh "; do
            sleep 2
          done
          SSH_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          echo "::add-mask::$SSH_URL"
          echo "TMATE_SSH=$SSH_URL" >> $GITHUB_ENV

      - name: Send Terminal Link to Telegram
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
          SSH_URL: ${{ env.TMATE_SSH }}
        run: |
          set +x
          MESSAGE="*Claude Code Ready*
          
          • *SSH:* \`$SSH_URL\` "
          curl -sX POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHATID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}" \
            > /dev/null 2>&1

      - name: Keep Session Alive Until Exit
        run: |
          while tmate -S /tmp/tmate.sock has-session 2>/dev/null
          do
            sleep 5
          done

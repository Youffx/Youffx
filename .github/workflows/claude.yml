name: OpenCode

on:
 workflow_dispatch:
   inputs:
     do_legacy:
      description: "4.19"
      required: false
      type: boolean
      default: true
     do_gki:
      description: "5.10"
      required: false
      type: boolean
      default: false
     do_ksu:
      description: "KernelSU"
      required: false
      type: boolean
      default: false
     do_bwx:
      description: "INF App"
      required: false
      type: boolean
      default: false
     do_other:
      description: "other"
      required: false
      type: boolean
      default: false

jobs:
 code-session:
  runs-on: ubuntu-latest
    
  steps:
  - name: Clone Target Kernel Repository
    if: github.event.inputs.do_legacy == 'true'
    env:
      PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
    run: |
      git clone --depth=1 -b vanilla \
        https://x-access-token:${PAT_TOKEN}@github.com/Youffx/kernel_xiaomi_rosemary.git \
        4.19

  - name: Clone Target Kernel Repository
    if: github.event.inputs.do_gki == 'true'
    env:
      PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
    run: |
      git clone --depth=7 -b legacy \
        https://x-access-token:${PAT_TOKEN}@github.com/Youffx/android_kernel_xiaomi_mt6785_5.10.git \
        5.10

  - name: Clone KernelSU
    if: github.event.inputs.do_ksu == 'true'
    env:
      PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
    run: |
      git clone --depth=12 -b legacy-susfs \
        https://x-access-token:${PAT_TOKEN}@github.com/Youffx/KernelSU-Next.git \
        ksu

  - name: Clone INF App
    if: github.event.inputs.do_bwx == 'true'
    env:
      PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
    run: |
      git clone --depth=1 \
        https://x-access-token:${PAT_TOKEN}@github.com/Youffx/Infra-BWX.git \
        Infra-BWX
        
  - name: Clone Other
    if: github.event.inputs.do_other == 'true'
    env:
      PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
    run: |
      git clone --depth=1 -b cip2 \
        https://x-access-token:${PAT_TOKEN}@github.com/xxblebleblexx/android_kernel_xiaomi_rosemary.git \
        4.19-b

  - name: Configure Git + Import GPG
    run: |
      git config --global user.name "${{ secrets.USER }}"
      git config --global user.email "${{ secrets.EMAIL }}"

      mkdir -p ~/.gnupg
      chmod 700 ~/.gnupg

      echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
      echo "default-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
      echo "max-cache-ttl 36000" >> ~/.gnupg/gpg-agent.conf
      echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

      echo "${{ secrets.GPG_PRIVATE_KEY }}" > private.key
      gpg --batch --yes --pinentry-mode loopback \
        --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
        --import private.key
      rm -f private.key

      gpgconf --kill gpg-agent
      gpg-connect-agent reloadagent /bye

      echo "test" | gpg --clearsign \
        --batch \
        --pinentry-mode loopback \
        --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
        > /dev/null

      git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"
      git config --global commit.gpgsign true
      git config --global tag.gpgsign true
      git config --global gpg.program gpg

  - name: Set Git Author Environment
    run: |
      echo "GIT_AUTHOR_NAME=${{ secrets.USER }}" >> $GITHUB_ENV
      echo "GIT_AUTHOR_EMAIL=${{ secrets.EMAIL }}" >> $GITHUB_ENV
      echo "GIT_COMMITTER_NAME=${{ secrets.USER }}" >> $GITHUB_ENV
      echo "GIT_COMMITTER_EMAIL=${{ secrets.EMAIL }}" >> $GITHUB_ENV
        
  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Cache NPM
    uses: actions/cache@v4
    with:
      path: ~/.npm
      key: ${{ runner.os }}-npm-opencode-v1
      restore-keys: |
        ${{ runner.os }}-npm-

  - name: Install OpenCode + Ponytail
    run: |
      npm i -g opencode-ai
      npm i -g @dietrichgebert/ponytail
      npm i -g rtk

  - name: Configure OpenCode
    working-directory: ${{ github.workspace }}
    run: |
      cat > opencode.json <<'EOF'
      {
        "$schema": "https://opencode.ai/config.json",
        "plugin": [
          "@dietrichgebert/ponytail"
        ]
      }
      EOF

  - name: Setup Tmate Manually
    run: |
      sudo apt-get update
      sudo apt-get install -y tmate

      tmate -S /tmp/tmate.sock new-session -d \
        "cd $GITHUB_WORKSPACE && exec bash"

      until tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' | grep -q "ssh "; do
        sleep 2
      done

      SSH_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')

      echo "::add-mask::$SSH_URL"
      echo "TMATE_SSH=$SSH_URL" >> $GITHUB_ENV

  - name: Send Terminal Link to Telegram
    env:
      TOKEN: ${{ secrets.TG_TOKEN }}
      CHATID: ${{ secrets.TG_CHATID }}
      SSH_URL: ${{ env.TMATE_SSH }}
    run: |
      set +x

      MESSAGE="*OpenCode Ready*

      • *SSH:* \`$SSH_URL\`"

      curl -sX POST \
        "https://api.telegram.org/bot${TOKEN}/sendMessage" \
        -d "chat_id=${CHATID}" \
        -d "parse_mode=Markdown" \
        -d "text=${MESSAGE}" \
        > /dev/null 2>&1

  - name: Keep Session Alive Until Exit
    run: |
      while tmate -S /tmp/tmate.sock has-session 2>/dev/null
      do
        sleep 5
      done

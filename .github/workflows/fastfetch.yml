name: Fastfetch

on:
  workflow_dispatch:

jobs:
  interactive-fastfetch:
    runs-on: ubuntu-latest

    steps:
      - name: Cache Fastfetch Binary
        id: cache-fastfetch
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/fastfetch
          key: fastfetch-binary-v2

      - name: Install Fastfetch via GitHub Release
        if: steps.cache-fastfetch.outputs.cache-hit != 'true'
        run: |
          URL=$(curl -s https://api.github.com/repos/fastfetch-cli/fastfetch/releases/latest | grep "browser_download_url.*linux-amd64.deb" | cut -d '"' -f 4)
          curl -L -o fastfetch.deb "$URL"
          sudo apt-get install ./fastfetch.deb -y
          sudo cp /usr/bin/fastfetch /usr/local/bin/fastfetch

      - name: Inject Cached Fastfetch
        if: steps.cache-fastfetch.outputs.cache-hit == 'true'
        run: |
          sudo cp /usr/local/bin/fastfetch /usr/bin/fastfetch
          sudo chmod +x /usr/bin/fastfetch

      - name: Create Custom Fastfetch Config
        run: |
          mkdir -p ~/.config/fastfetch
          cat << 'EOF' > ~/.config/fastfetch/config.jsonc
          {
              "$schema": "https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json",
              "logo": {
                  "type": "builtin",
                  "source": "ghost",
                  "color": {
                      "1": "red",
                      "2": "light_yellow"
                  }
              },
              "display": {
                  "pipe": false,
                  "color": {
                      "keys": "light_yellow",
                      "title": "red"
                  }
              },
              "modules": [
                  {
                      "type": "custom",
                      "format": "\u001b[1;31mYouffx\u001b[0m@\u001b[1;33mcollections\u001b[0m"
                  },
                  "separator",
                  "os",
                  "host",
                  "kernel",
                  "uptime",
                  "packages",
                  "shell",
                  "display",
                  "terminal",
                  "cpu",
                  "memory",
                  "swap",
                  "disk",
                  "localip",
                  "locale",
                  "break",
                  "colors"
              ]
          }
          EOF

      - name: Setup Tmate Background Server
        id: tmate-setup
        run: |
          sudo apt-get update && sudo apt-get install tmate -y
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          SSH_CONN=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          echo "ssh_conn=$SSH_CONN" >> $GITHUB_OUTPUT

      - name: Send Terminal Link to Telegram
        env:
          TOKEN: ${{ secrets.TG_TOKEN }}
          CHATID: ${{ secrets.TG_CHATID }}
          SSH_URL: ${{ steps.tmate-setup.outputs.ssh_conn }}

        run: |
          tg() {
            curl -sX POST https://api.telegram.org/bot"${TOKEN}"/sendMessage \
              -d chat_id="${CHATID}" \
              -d parse_mode=Markdown \
              -d disable_web_page_preview=true \
              -d text="$1" > /dev/null 2>&1
          }

          MESSAGE="*GitHub Actions Interactive Session*
          
          *Repository:* \`${{ github.repository }}\`
          *Triggered By:* \`${{ github.actor }}\`
          
          • *SSH Terminal:* [Open Here]($SSH_URL)
          
          _Server ini akan tetap menyala sampai kamu mengetik 'exit' di dalam terminal._"

          tg "$MESSAGE"

      - name: Keep Session Alive Safely
        run: |
          echo "Waiting..."
          while [ -S /tmp/tmate.sock ]; do
            sleep 5
          done
          echo "Bye, see u later"
          

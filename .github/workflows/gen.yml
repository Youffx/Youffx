name: Genesis CI Release

on:
  workflow_dispatch:
    inputs:
      config_index:
        description: "Select (0,1,2,3,4)"
        required: true
        default: "0"
      use_llvm22:
        description: "Clang 20"
        required: false
        type: boolean
        default: true
      use_pgo:
        description: 'Enable PGO Optimization'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHATID: ${{ secrets.TG_CHATID }}

jobs:
  start:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      msg_id: ${{ steps.notify.outputs.msg_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Start
        id: notify
        run: |
          MID=$(python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status started \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          echo "msg_id=$MID" >> $GITHUB_OUTPUT

  build-ksu:
    name: Build KSU
    needs: [start]
    runs-on: ubuntu-latest
    outputs:
      kern_ver: ${{ steps.kinfo.outputs.version }}
      commit_log: ${{ steps.kinfo.outputs.commit }}
      compiler_ver: ${{ steps.kinfo.outputs.compiler }}
      device_name: ${{ steps.cfg.outputs.name }}
      build_time: ${{ steps.calc.outputs.duration }}
      zip_hash: ${{ steps.calc.outputs.hash }}

    steps:
      - name: Start Timer
        id: start_timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev liblz4-tool libncurses5-dev libssl-dev lzop rsync zip zlib1g-dev jq

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ksu-${{ runner.os }}-${{ github.event.inputs.config_index }}-${{ github.run_id }}
          restore-keys: |
            ccache-ksu-${{ runner.os }}-${{ github.event.inputs.config_index }}-
            ccache-ksu-${{ runner.os }}-

      - name: Restore LLVM 17
        if: github.event.inputs.use_llvm22 != 'true'
        uses: actions/cache@v4
        with:
          path: llvm
          key: clang+llvm-17.0.6

      - name: Setup LLVM 17
        if: github.event.inputs.use_llvm22 != 'true'
        run: |
          if [ ! -d "llvm/bin" ]; then
            mkdir -p llvm
            curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz | tar -xJ -C llvm --strip-components=1
          fi
          echo "$PWD/llvm/bin" >> $GITHUB_PATH

      - name: Cache Clang 20
        if: github.event.inputs.use_llvm22 == 'true'
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm
          key: llvm-mlgo-r547379

      - name: Setup Clang 20
        if: github.event.inputs.use_llvm22 == 'true'
        run: |
          if [ ! -d "llvm/bin" ]; then
            export LLVM_DIR="$PWD/llvm"
            rm -rf "$LLVM_DIR"
            mkdir -p "$LLVM_DIR"
            wget -qO- "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" | tar xz -C "$LLVM_DIR"
            wget -qO- "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/mlgo-models.tar.gz" | tar xz -C "$LLVM_DIR" || true
          fi
          echo "$PWD/llvm/bin" >> $GITHUB_PATH

      - name: Load Config
        id: cfg
        run: |
          CONFIG=$(jq -c ".[$CONFIG_INDEX]" configs/builds.json)
          NAME=$(echo "$CONFIG" | jq -r '.name')
          echo "config=$CONFIG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
        env:
          CONFIG_INDEX: ${{ github.event.inputs.config_index }}

      - name: Clone Kernel
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          REPO=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.repo')
          BRANCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.branch')
          DEPTH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.fetchDepth')

          REPO=$(echo "$REPO" | sed "s|https://|https://${PAT_TOKEN}@|")

          git clone --depth=$DEPTH --branch $BRANCH "$REPO" kernel

      - name: Get Kernel Info
        id: kinfo
        run: |
          cd kernel
          V=$(make kernelversion)
          C=$(git log -1 --format='%h %s')
          COMP=$($GITHUB_WORKSPACE/llvm/bin/clang --version | head -n 1 | cut -d'(' -f1)
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "commit=$C" >> $GITHUB_OUTPUT
          echo "compiler=$COMP" >> $GITHUB_OUTPUT
          echo "KERNEL_VER=$V" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=$C" >> $GITHUB_ENV
          echo "KERNEL_COMPILER=$COMP" >> $GITHUB_ENV

      - name: Setup ccache
        run: |
          ccache -M 10G
          ccache -o compression=true
          ccache -o base_dir=$GITHUB_WORKSPACE
          ccache -o hash_dir=false
          ccache -z

      - name: Restore Message ID
        run: |
          echo "${{ needs.start.outputs.msg_id }}" > $GITHUB_WORKSPACE/.build_msg_id

      - name: Start KSU
        run: |
          gh variable set PROGRESS_KSU --repo ${{ github.repository }} --body "0" 2>/dev/null || true
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status progress \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --job KSU \
            --progress 0 \
            --kernel-ver "$KERNEL_VER" \
            --commit "$KERNEL_COMMIT" \
            --compiler "$KERNEL_COMPILER" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Prepare PGO Profile
        if: ${{ github.event.inputs.use_pgo == 'true' }}
        env:
          PGO_URL: ${{ secrets.GEN_FILE }}
        run: |
          curl -L -o vmlinux.profraw "$PGO_URL"
          if [ "${{ github.event.inputs.use_llvm22 }}" = "true" ]; then
            sudo apt-get install -y llvm-17
            llvm-profdata-17 merge -o kernel/vmlinux.profdata vmlinux.profraw
          else
            $PWD/llvm/bin/llvm-profdata merge -o kernel/vmlinux.profdata vmlinux.profraw
          fi

      - name: Apply Root Method
        run: |
          ROOT_TYPE=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.type')

          if [ "$ROOT_TYPE" != "none" ]; then
            SETUP=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.setup')
            ARG=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.arg')
            PATCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.manualPatch')
            EXTRA_PATCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.extraPatch // empty')
            SUSFS_PATCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.susfsPatch // empty')
            i_PATCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.iPatch // empty')
            ii_PATCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.iiPatch // empty')
            iii_PATCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.iiiPatch // empty')
            iv_PATCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.ivPatch // empty')
            v_PATCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.root.vPatch // empty')

            cd kernel

            curl -LSs "$SETUP" | bash -s $ARG

            [ "$PATCH" != "null" ] && curl -LSs "$PATCH" | patch -p1 || true
            [ -n "$EXTRA_PATCH" ] && curl -LSs "$EXTRA_PATCH" | patch -p1 || true
            [ -n "$SUSFS_PATCH" ] && curl -LSs "$SUSFS_PATCH" | patch -p1 || true
            [ -n "$i_PATCH" ] && curl -LSs "$i_PATCH" | patch -p1 || true
            [ -n "$ii_PATCH" ] && curl -LSs "$ii_PATCH" | patch -p1 || true
            [ -n "$iii_PATCH" ] && curl -LSs "$iii_PATCH" | patch -p1 || true
            [ -n "$iv_PATCH" ] && curl -LSs "$iv_PATCH" | patch -p1 || true
            [ -n "$v_PATCH" ] && curl -LSs "$v_PATCH" | patch -p1 || true

            cd ..
          fi

      - name: Configure Kernel KSU
        run: |
          set -o pipefail

          DEFCONFIG=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '."ksu-defconfig"')

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/llvm/bin:$PATH"
          export KBUILD_BUILD_USER="youffx"
          export KBUILD_BUILD_HOST="collection"
          export KBUILD_BUILD_VERSION=1
          export KCONFIG_NOTIMESTAMP=1
          export KBUILD_BUILD_TIMESTAMP="Thu Jan 1 00:00:00 UTC 1970"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=10G
          export KBUILD_CFLAGS="-mllvm -enable-ml-inliner=release -mllvm -enable-ml-regalloc=release"

          ccache -s

          cd kernel
          make O=out $DEFCONFIG

          sed -i '/CONFIG_RANDOMIZE_BASE/d' out/.config
          sed -i '/CONFIG_MQ_IOSCHED_DEFAULT_KYBER/d' out/.config

          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> out/.config
          echo "CONFIG_RANDOMIZE_BASE=y" >> out/.config
          echo "CONFIG_LTO=y" >> out/.config
          echo "CONFIG_LTO_CLANG=y" >> out/.config
          echo "CONFIG_THINLTO=y" >> out/.config

          MONTH_IDX=$(TZ='Asia/Jakarta' date +%-m)
          DAY_IDX=$(TZ='Asia/Jakarta' date +%-d)

          months=("" "Iānuārıus" "februārıus" "mārtıus" "aprīlıs" "māıus" "Iūnıus" "Iūlıus" "āugıts" "seūptıs" "ōctıs" "nōvlıs" "dectıūs")
          romans=("" "ı" "ıı" "ııı" "ıv" "v" "vı" "vıı" "vııı" "ıx" "x" "xı" "xıı" "xııı" "xıv" "xv" "xvı" "xvıı" "xvııı" "xıx" "xx" "xxı" "xxıı" "xxııı" "xxıv" "xxv" "xxvı" "xxvıı" "xxvııı" "xxıx" "xxx" "xxxı")

          LV="-GEN-${months[$MONTH_IDX]}-${romans[$DAY_IDX]}"
          LV_ESCAPED=$(printf '%s\n' "$LV" | sed 's/[&#]/\\&/g')

          if grep -q "^CONFIG_LOCALVERSION=" out/.config; then
            sed -i "s#^CONFIG_LOCALVERSION=.*#CONFIG_LOCALVERSION=\"$LV_ESCAPED\"#" out/.config
          else
            echo "CONFIG_LOCALVERSION=\"$LV\"" >> out/.config
          fi

          echo "LV=$LV" >> $GITHUB_ENV

          make O=out olddefconfig

          echo "--- DEBUG ---"
          grep -E "LTO|CONSERVATIVE|BLK_PM|KYBER|RANDOMIZE_BASE|KSU|SUSFS" out/.config
          echo "---------------------------------"

      - name: Build Kernel KSU
        run: |
          cd kernel
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            KBUILD_LDFLAGS="--emit-relocs --trace-symbol=__bad_udelay" \
            Image.gz-dtb 2>&1 | tee $GITHUB_WORKSPACE/build-ksu.log &
          BUILD_PID=$!

          while kill -0 $BUILD_PID 2>/dev/null; do
            PCT=$(python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/builder'); from reporter import estimate_progress; print(estimate_progress('$GITHUB_WORKSPACE/build-ksu.log'))" 2>/dev/null || echo "0")
            gh variable set PROGRESS_KSU --repo ${{ github.repository }} --body "$PCT" 2>/dev/null || true
            OTHER_PCT=$(gh variable get PROGRESS_NONKSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
            PREV_STATUS=$(python3 -c "import json; print(json.dumps({'ksu': $PCT, 'nonksu': $OTHER_PCT}))")
            python3 $GITHUB_WORKSPACE/builder/reporter.py \
              --status progress \
              --token "$TG_TOKEN" \
              --chat-id "$TG_CHATID" \
              --job KSU \
              --progress "$PCT" \
              --prev-status "$PREV_STATUS" \
              --kernel-ver "$KERNEL_VER" \
              --commit "$KERNEL_COMMIT" \
              --compiler "$KERNEL_COMPILER" \
              --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            sleep 15
          done

          PCT=$(python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/builder'); from reporter import estimate_progress; print(estimate_progress('$GITHUB_WORKSPACE/build-ksu.log'))" 2>/dev/null || echo "0")
          gh variable set PROGRESS_KSU --repo ${{ github.repository }} --body "$PCT" 2>/dev/null || true
          OTHER_PCT=$(gh variable get PROGRESS_NONKSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          PREV_STATUS=$(python3 -c "import json; print(json.dumps({'ksu': $PCT, 'nonksu': $OTHER_PCT}))")
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status progress \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --job KSU \
            --progress "$PCT" \
            --prev-status "$PREV_STATUS" \
            --kernel-ver "$KERNEL_VER" \
            --commit "$KERNEL_COMMIT" \
            --compiler "$KERNEL_COMPILER" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          wait $BUILD_PID
          exit $?

      - name: Package Flashable Zip KSU
        run: |
          DATE=$(TZ='Asia/Jakarta' date +"%Y%m%d-%H%M")
          ZIP_NAME="${LV}-KSU-${DATE}"

          IMAGE="kernel/out/arch/arm64/boot/Image.gz-dtb"
          mkdir -p output
          cp "$IMAGE" .github/Flash/kernels/

          cd .github/Flash/
          zip -r "../../output/${ZIP_NAME}.zip" ./*
          cd ../../

      - name: Calculate Metadata
        id: calc
        run: |
          END=$(date +%s)
          DIFF=$((END - ${{ steps.start_timer.outputs.start }}))
          MIN=$((DIFF / 60))
          SEC=$((DIFF % 60))
          echo "duration=${MIN}m ${SEC}s" >> $GITHUB_OUTPUT
          HASH=$(md5sum output/*.zip | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Mark KSU Done
        run: |
          gh variable set PROGRESS_KSU --repo ${{ github.repository }} --body "100" 2>/dev/null || true
          OTHER_PCT=$(gh variable get PROGRESS_NONKSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          PREV_STATUS=$(python3 -c "import json; print(json.dumps({'ksu': 100, 'nonksu': $OTHER_PCT}))")
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status done \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --job KSU \
            --prev-status "$PREV_STATUS" \
            --build-time "${{ steps.calc.outputs.duration }}" \
            --zip-hash "${{ steps.calc.outputs.hash }}" \
            --kernel-ver "$KERNEL_VER" \
            --commit "$KERNEL_COMMIT" \
            --compiler "$KERNEL_COMPILER" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload Flash Files
        uses: actions/upload-artifact@v4
        with:
          name: ksu
          path: .github/Flash/

      - name: Upload ZIP
        if: github.event.inputs.prerelease != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zip-ksu
          path: output/*.zip

      - name: Show ccache statistics
        run: ccache -s

      - name: Notify Failure
        if: failure()
        run: |
          PCT=$(gh variable get PROGRESS_KSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          OTHER_PCT=$(gh variable get PROGRESS_NONKSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          PREV_STATUS=$(python3 -c "import json; print(json.dumps({'ksu': $PCT, 'nonksu': $OTHER_PCT}))")
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status failure \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --job KSU \
            --prev-status "$PREV_STATUS" \
            --log "$GITHUB_WORKSPACE/build-ksu.log" \
            --kernel-ver "$KERNEL_VER" \
            --commit "$KERNEL_COMMIT" \
            --compiler "$KERNEL_COMPILER" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify Cancelled
        if: cancelled()
        run: |
          PCT=$(gh variable get PROGRESS_KSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          OTHER_PCT=$(gh variable get PROGRESS_NONKSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          PREV_STATUS=$(python3 -c "import json; print(json.dumps({'ksu': $PCT, 'nonksu': $OTHER_PCT}))")
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status aborted \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --job KSU \
            --prev-status "$PREV_STATUS" \
            --kernel-ver "$KERNEL_VER" \
            --commit "$KERNEL_COMMIT" \
            --compiler "$KERNEL_COMPILER" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  build-nonksu:
    name: Build NONKSU
    needs: [start]
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.calc.outputs.duration }}
      zip_hash: ${{ steps.calc.outputs.hash }}

    steps:
      - name: Start Timer
        id: start_timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev liblz4-tool libncurses5-dev libssl-dev lzop rsync zip zlib1g-dev jq

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-nonksu-${{ runner.os }}-${{ github.event.inputs.config_index }}-${{ github.run_id }}
          restore-keys: |
            ccache-nonksu-${{ runner.os }}-${{ github.event.inputs.config_index }}-
            ccache-nonksu-${{ runner.os }}-

      - name: Restore LLVM 17
        if: github.event.inputs.use_llvm22 != 'true'
        uses: actions/cache@v4
        with:
          path: llvm
          key: clang+llvm-17.0.6

      - name: Setup LLVM 17
        if: github.event.inputs.use_llvm22 != 'true'
        run: |
          if [ ! -d "llvm/bin" ]; then
            mkdir -p llvm
            curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz | tar -xJ -C llvm --strip-components=1
          fi
          echo "$PWD/llvm/bin" >> $GITHUB_PATH

      - name: Cache Clang 20
        if: github.event.inputs.use_llvm22 == 'true'
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm
          key: llvm-mlgo-r547379

      - name: Setup Clang 20
        if: github.event.inputs.use_llvm22 == 'true'
        run: |
          if [ ! -d "llvm/bin" ]; then
            export LLVM_DIR="$PWD/llvm"
            rm -rf "$LLVM_DIR"
            mkdir -p "$LLVM_DIR"
            wget -qO- "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" | tar xz -C "$LLVM_DIR"
            wget -qO- "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/mlgo-models.tar.gz" | tar xz -C "$LLVM_DIR" || true
          fi
          echo "$PWD/llvm/bin" >> $GITHUB_PATH

      - name: Load Config
        id: cfg
        run: |
          CONFIG=$(jq -c ".[$CONFIG_INDEX]" configs/builds.json)
          NAME=$(echo "$CONFIG" | jq -r '.name')
          echo "config=$CONFIG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
        env:
          CONFIG_INDEX: ${{ github.event.inputs.config_index }}

      - name: Clone Kernel
        env:
          PAT_TOKEN: ${{ secrets.REPO_A_PAT }}
        run: |
          REPO=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.repo')
          BRANCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.branch')
          DEPTH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.fetchDepth')

          REPO=$(echo "$REPO" | sed "s|https://|https://${PAT_TOKEN}@|")

          git clone --depth=$DEPTH --branch $BRANCH "$REPO" kernel

      - name: Get Kernel Info
        id: kinfo
        run: |
          cd kernel
          V=$(make kernelversion)
          C=$(git log -1 --format='%h %s')
          COMP=$($GITHUB_WORKSPACE/llvm/bin/clang --version | head -n 1 | cut -d'(' -f1)
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "commit=$C" >> $GITHUB_OUTPUT
          echo "compiler=$COMP" >> $GITHUB_OUTPUT
          echo "KERNEL_VER=$V" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=$C" >> $GITHUB_ENV
          echo "KERNEL_COMPILER=$COMP" >> $GITHUB_ENV

      - name: Setup ccache
        run: |
          ccache -M 10G
          ccache -o compression=true
          ccache -o base_dir=$GITHUB_WORKSPACE
          ccache -o hash_dir=false
          ccache -z

      - name: Restore Message ID
        run: |
          echo "${{ needs.start.outputs.msg_id }}" > $GITHUB_WORKSPACE/.build_msg_id

      - name: Start NONKSU
        run: |
          gh variable set PROGRESS_NONKSU --repo ${{ github.repository }} --body "0" 2>/dev/null || true
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status progress \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --job NONKSU \
            --progress 0 \
            --kernel-ver "$KERNEL_VER" \
            --commit "$KERNEL_COMMIT" \
            --compiler "$KERNEL_COMPILER" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Prepare PGO Profile
        if: ${{ github.event.inputs.use_pgo == 'true' }}
        env:
          PGO_URL: ${{ secrets.PGO_FILE }}
        run: |
          curl -L -o vmlinux.profraw "$PGO_URL"
          if [ "${{ github.event.inputs.use_llvm22 }}" = "true" ]; then
            sudo apt-get install -y llvm-17
            llvm-profdata-17 merge -o kernel/vmlinux.profdata vmlinux.profraw
          else
            $PWD/llvm/bin/llvm-profdata merge -o kernel/vmlinux.profdata vmlinux.profraw
          fi

      - name: Configure Kernel NONKSU
        run: |
          set -o pipefail

          DEFCONFIG=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '."nonksu-defconfig"')

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/llvm/bin:$PATH"
          export KBUILD_BUILD_USER="youffx"
          export KBUILD_BUILD_HOST="collection"
          export KBUILD_BUILD_VERSION=1
          export KCONFIG_NOTIMESTAMP=1
          export KBUILD_BUILD_TIMESTAMP="Thu Jan 1 00:00:00 UTC 1970"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=10G
          export KBUILD_CFLAGS="-mllvm -enable-ml-inliner=release -mllvm -enable-ml-regalloc=release"

          ccache -s

          cd kernel
          make O=out $DEFCONFIG

          sed -i '/CONFIG_RANDOMIZE_BASE/d' out/.config
          sed -i '/CONFIG_MQ_IOSCHED_DEFAULT_KYBER/d' out/.config

          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> out/.config
          echo "CONFIG_RANDOMIZE_BASE=y" >> out/.config
          echo "CONFIG_LTO=y" >> out/.config
          echo "CONFIG_LTO_CLANG=y" >> out/.config
          echo "CONFIG_THINLTO=y" >> out/.config

          MONTH_IDX=$(TZ='Asia/Jakarta' date +%-m)
          DAY_IDX=$(TZ='Asia/Jakarta' date +%-d)

          months=("" "Iānuārıus" "februārıus" "mārtıus" "aprīlıs" "māıus" "Iūnıus" "Iūlıus" "āugıts" "seūptıs" "ōctıs" "nōvlıs" "dectıūs")
          romans=("" "ı" "ıı" "ııı" "ıv" "v" "vı" "vıı" "vııı" "ıx" "x" "xı" "xıı" "xııı" "xıv" "xv" "xvı" "xvıı" "xvııı" "xıx" "xx" "xxı" "xxıı" "xxııı" "xxıv" "xxv" "xxvı" "xxvıı" "xxvııı" "xxıx" "xxx" "xxxı")

          LV="-GEN-${months[$MONTH_IDX]}-${romans[$DAY_IDX]}"
          LV_ESCAPED=$(printf '%s\n' "$LV" | sed 's/[&#]/\\&/g')

          if grep -q "^CONFIG_LOCALVERSION=" out/.config; then
            sed -i "s#^CONFIG_LOCALVERSION=.*#CONFIG_LOCALVERSION=\"$LV_ESCAPED\"#" out/.config
          else
            echo "CONFIG_LOCALVERSION=\"$LV\"" >> out/.config
          fi

          echo "LV=$LV" >> $GITHUB_ENV

          make O=out olddefconfig

      - name: Build Kernel NONKSU
        run: |
          cd kernel
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            KBUILD_LDFLAGS="--emit-relocs --trace-symbol=__bad_udelay" \
            Image.gz-dtb 2>&1 | tee $GITHUB_WORKSPACE/build-nonksu.log &
          BUILD_PID=$!

          while kill -0 $BUILD_PID 2>/dev/null; do
            PCT=$(python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/builder'); from reporter import estimate_progress; print(estimate_progress('$GITHUB_WORKSPACE/build-nonksu.log'))" 2>/dev/null || echo "0")
            gh variable set PROGRESS_NONKSU --repo ${{ github.repository }} --body "$PCT" 2>/dev/null || true
            OTHER_PCT=$(gh variable get PROGRESS_KSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
            PREV_STATUS=$(python3 -c "import json; print(json.dumps({'ksu': $OTHER_PCT, 'nonksu': $PCT}))")
            python3 $GITHUB_WORKSPACE/builder/reporter.py \
              --status progress \
              --token "$TG_TOKEN" \
              --chat-id "$TG_CHATID" \
              --job NONKSU \
              --progress "$PCT" \
              --prev-status "$PREV_STATUS" \
              --kernel-ver "$KERNEL_VER" \
              --commit "$KERNEL_COMMIT" \
              --compiler "$KERNEL_COMPILER" \
              --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            sleep 15
          done

          PCT=$(python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/builder'); from reporter import estimate_progress; print(estimate_progress('$GITHUB_WORKSPACE/build-nonksu.log'))" 2>/dev/null || echo "0")
          gh variable set PROGRESS_NONKSU --repo ${{ github.repository }} --body "$PCT" 2>/dev/null || true
          OTHER_PCT=$(gh variable get PROGRESS_KSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          PREV_STATUS=$(python3 -c "import json; print(json.dumps({'ksu': $OTHER_PCT, 'nonksu': $PCT}))")
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status progress \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --job NONKSU \
            --progress "$PCT" \
            --prev-status "$PREV_STATUS" \
            --kernel-ver "$KERNEL_VER" \
            --commit "$KERNEL_COMMIT" \
            --compiler "$KERNEL_COMPILER" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          wait $BUILD_PID
          exit $?

      - name: Package Flashable Zip NONKSU
        run: |
          DATE=$(TZ='Asia/Jakarta' date +"%Y%m%d-%H%M")
          ZIP_NAME="${LV}-NONKSU-${DATE}"

          IMAGE="kernel/out/arch/arm64/boot/Image.gz-dtb"
          mkdir -p output
          cp "$IMAGE" .github/Flash/kernels/

          cd .github/Flash/
          zip -r "../../output/${ZIP_NAME}.zip" ./*
          cd ../../

      - name: Calculate Metadata
        id: calc
        run: |
          END=$(date +%s)
          DIFF=$((END - ${{ steps.start_timer.outputs.start }}))
          MIN=$((DIFF / 60))
          SEC=$((DIFF % 60))
          echo "duration=${MIN}m ${SEC}s" >> $GITHUB_OUTPUT
          HASH=$(md5sum output/*.zip | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Mark NONKSU Done
        run: |
          gh variable set PROGRESS_NONKSU --repo ${{ github.repository }} --body "100" 2>/dev/null || true
          OTHER_PCT=$(gh variable get PROGRESS_KSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          PREV_STATUS=$(python3 -c "import json; print(json.dumps({'ksu': $OTHER_PCT, 'nonksu': 100}))")
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status done \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --job NONKSU \
            --prev-status "$PREV_STATUS" \
            --build-time "${{ steps.calc.outputs.duration }}" \
            --zip-hash "${{ steps.calc.outputs.hash }}" \
            --kernel-ver "$KERNEL_VER" \
            --commit "$KERNEL_COMMIT" \
            --compiler "$KERNEL_COMPILER" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload Flash Files
        uses: actions/upload-artifact@v4
        with:
          name: nonksu
          path: .github/Flash/

      - name: Upload ZIP
        if: github.event.inputs.prerelease != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zip-nonksu
          path: output/*.zip

      - name: Show ccache statistics
        run: ccache -s

      - name: Notify Failure
        if: failure()
        run: |
          PCT=$(gh variable get PROGRESS_NONKSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          OTHER_PCT=$(gh variable get PROGRESS_KSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          PREV_STATUS=$(python3 -c "import json; print(json.dumps({'ksu': $OTHER_PCT, 'nonksu': $PCT}))")
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status failure \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --job NONKSU \
            --prev-status "$PREV_STATUS" \
            --log "$GITHUB_WORKSPACE/build-nonksu.log" \
            --kernel-ver "$KERNEL_VER" \
            --commit "$KERNEL_COMMIT" \
            --compiler "$KERNEL_COMPILER" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify Cancelled
        if: cancelled()
        run: |
          PCT=$(gh variable get PROGRESS_NONKSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          OTHER_PCT=$(gh variable get PROGRESS_KSU --repo ${{ github.repository }} 2>/dev/null || echo "0")
          PREV_STATUS=$(python3 -c "import json; print(json.dumps({'ksu': $OTHER_PCT, 'nonksu': $PCT}))")
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status aborted \
            --token "$TG_TOKEN" \
            --chat-id "$TG_CHATID" \
            --job NONKSU \
            --prev-status "$PREV_STATUS" \
            --kernel-ver "$KERNEL_VER" \
            --commit "$KERNEL_COMMIT" \
            --compiler "$KERNEL_COMPILER" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  
  Release:
    name: Release
    needs: [start, build-ksu, build-nonksu]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Message ID
        run: |
          echo "${{ needs.start.outputs.msg_id }}" > $GITHUB_WORKSPACE/.build_msg_id

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Collect ZIPs
        if: github.event.inputs.prerelease != 'true'
        run: |
          mkdir final
          find . -name "*.zip" -exec cp {} final/ \;

      - name: Create Release
        if: github.event.inputs.prerelease != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: Release-${{ github.run_id }}
          name: Genesis Kernel Release
          prerelease: false
          body: |
            ### Genesis Kernel Release

            **Build Details:**
            - Version: Genesis

          files: final/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notification
        run: |
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            BUILD_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            BUILD_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/Release-${{ github.run_id }}"
          fi
          python3 $GITHUB_WORKSPACE/builder/reporter.py \
            --status finalize \
            --token "${{ secrets.TG_TOKEN }}" \
            --chat-id "${{ secrets.TG_CHATID }}" \
            --kernel-ver "${{ needs.build-ksu.outputs.kern_ver }}" \
            --compiler "${{ needs.build-ksu.outputs.compiler_ver }}" \
            --commit "${{ needs.build-ksu.outputs.commit_log }}" \
            --build-time "${{ needs.build-ksu.outputs.build_time }}" \
            --build-time2 "${{ needs.build-nonksu.outputs.build_time }}" \
            --zip-hash "${{ needs.build-ksu.outputs.zip_hash }}" \
            --zip-hash2 "${{ needs.build-nonksu.outputs.zip_hash }}" \
            --build-url "$BUILD_URL"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-nonksu-${{ runner.os }}-${{ github.event.inputs.config_index }}-${{ github.run_id }}
          restore-keys: |
            ccache-nonksu-${{ runner.os }}-${{ github.event.inputs.config_index }}-
            ccache-nonksu-${{ runner.os }}-

      - name: Restore LLVM 17

      - name: Setup LLVM 17
        if: github.event.inputs.use_llvm22 != 'true'
        run: |
          if [ ! -d "llvm/bin" ]; then
            mkdir -p llvm
            curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz | tar -xJ -C llvm --strip-components=1
          fi
          echo "$PWD/llvm/bin" >> $GITHUB_PATH

      - name: Cache LLVM 22 DEBs
        if: github.event.inputs.use_llvm22 == 'true'
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm-22-debs
          key: llvm-22-debs-${{ runner.os }}

      - name: Setup LLVM 22
        if: github.event.inputs.use_llvm22 == 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          CODENAME=$(lsb_release -cs)
          sudo add-apt-repository -y "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-22 main"
          sudo apt-get update -y
          if [ "${{ steps.cache-llvm.outputs.cache-hit }}" != "true" ]; then
            mkdir -p llvm-22-debs
            sudo apt-get install --download-only -y clang-22 lld-22 llvm-22
            cp /var/cache/apt/archives/*22*.deb llvm-22-debs/ 2>/dev/null || cp /var/cache/apt/archives/*.deb llvm-22-debs/
          fi
          sudo dpkg -i llvm-22-debs/*.deb || sudo apt-get install -f -y
          mkdir -p llvm/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-profdata; do
            ln -sf /usr/bin/${tool}-22 llvm/bin/${tool}
          done
          echo "$PWD/llvm/bin" >> $GITHUB_PATH

      - name: Load Config
        id: cfg
        run: |
          CONFIG=$(jq -c ".[$CONFIG_INDEX]" configs/builds.json)
          NAME=$(echo "$CONFIG" | jq -r '.name')
          echo "config=$CONFIG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
        env:
          CONFIG_INDEX: ${{ github.event.inputs.config_index }}

      - name: Clone Kernel
        run: |
          REPO=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.repo')
          BRANCH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.branch')
          DEPTH=$(echo '${{ steps.cfg.outputs.config }}' | jq -r '.kernel.fetchDepth')

          git clone --depth=$DEPTH --branch $BRANCH $REPO kernel

      - name: Setup ccache
        run: |
          ccache -M 10G
          ccache -o compression=true
